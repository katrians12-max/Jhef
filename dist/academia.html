/* ---------- Bipcoins ---------- */
const BONUS=100,POR_AULA=50,POR_FASE=10,POR_ESTRELA=5;
const ls=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
/* quanto o aluno já ganhou: sempre calculado a partir do progresso (não dá para duplicar) */
function ganhos(robo,acad,run){let c=BONUS;const st=(robo&&robo.stars)||{};for(const k in st){const s=+st[k]||0;if(s>0)c+=POR_FASE+POR_ESTRELA*Math.min(3,s)}
 c+=((acad&&acad.done)||[]).length*POR_AULA;return c+ganhosRunner(run)+ganhosSnake(run)+ganhosDefesa(run)+ganhosBomber(run)+ganhosVez(run&&run.tempo)}
/* Bip Runner: o jogo guarda quanto rendeu em cada dia; cada dia vale no máximo RUN_DIA */
const RUN_DIA=60,runKey=pid=>"bipsite-runner:"+pid;
function ganhosRunner(run){let c=0;const m=(run&&run.coins)||{};for(const k in m)c+=Math.max(0,Math.min(RUN_DIA,Math.floor(+m[k]||0)));return c}
/* Bip Snake: guarda junto com o Runner (mesma chave), em scoins; cada dia vale no máximo SNAKE_DIA */
const SNAKE_DIA=60;
function ganhosSnake(run){let c=0;const m=(run&&run.scoins)||{};for(const k in m)c+=Math.max(0,Math.min(SNAKE_DIA,Math.floor(+m[k]||0)));return c}
const snakeBest=run=>{const b=(run&&run.best)||{};return Math.max(+b.snakemisto||0,+b.snakeregras||0,+b.snakecontas||0)};
/* Bip Defesa (infinito): também na chave do Runner. Recorde em best.definf = ondas vencidas × 100000 + pontos;
   Bipcoins do dia em dcoins, no máximo DEF_DIA */
const DEF_DIA=60;
function ganhosDefesa(run){let c=0;const m=(run&&run.dcoins)||{};for(const k in m)c+=Math.max(0,Math.min(DEF_DIA,Math.floor(+m[k]||0)));return c}
const defesaBest=run=>+(((run&&run.best)||{}).definf)||0;
const defesaDec=v=>({onda:Math.floor((+v||0)/100000),pts:(+v||0)%100000});
/* Bip Bomber: também na chave do Runner. Recorde em best.bomber = arenas vencidas × 100000 + pontos;
   bruns = partidas, bcoins = Bipcoins do dia (no máximo BOMB_DIA), bmeta = estrelas, conquistas e totais */
const BOMB_DIA=60;
function ganhosBomber(run){let c=0;const m=(run&&run.bcoins)||{};for(const k in m)c+=Math.max(0,Math.min(BOMB_DIA,Math.floor(+m[k]||0)));return c}
const bomberBest=run=>+(((run&&run.best)||{}).bomber)||0;
const bomberDec=v=>({arena:Math.floor((+v||0)/100000),pts:(+v||0)%100000});
/* ===== EQUILÍBRIO DO BIP (modo turma): minutos de jogo ativo por jogo, últimos 7 dias =====
   tempo = {d:{dia:{jogo:segundos}}, vez:{dia:segundos no "jogo da vez"}, eq:{bloq:{jogo:{falta}}, cred:{jogo:segundos}, t}}
   Um jogo com mais de EQ_LIM do tempo da semana "descansa" até o aluno jogar EQ_DESC nos jogos abaixo da média;
   depois ganha EQ_CRED de folga. Os 2 jogos menos jogados são os "jogos da vez": +1 Bipcoin por minuto (até VEZ_DIA). */
const JOGOS=["robo","academia","runner","snake","defesa","bomber"];
const NOME_JOGO={robo:"Robô Programador",academia:"Academia do Bip",runner:"Bip Runner",snake:"Bip Snake",defesa:"Bip Defesa",bomber:"Bip Bomber"};
const EQ_MIN=20*60,EQ_LIM=.35,EQ_DESC=6*60,EQ_CRED=8*60,VEZ_DIA=20;
const tempoKey=pid=>"bipsite-tempo:"+pid;
const diaDe=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function tempo7(tp,agora){const o={};JOGOS.forEach(g=>o[g]=0);const d=(tp&&tp.d)||{},hoje=agora||new Date();
 for(let i=0;i<7;i++){const x=new Date(hoje);x.setDate(x.getDate()-i);const k=diaDe(x);for(const g in d[k]||{})if(g in o)o[g]+=+d[k][g]||0}return o}
function ganhosVez(tp){let c=0;const v=(tp&&tp.vez)||{};for(const k in v)c+=Math.max(0,Math.min(VEZ_DIA,Math.floor((+v[k]||0)/60)));return c}
function mergeTempo(a,b){if(!a)return b;if(!b)return a;const d={};for(const s of [a.d||{},b.d||{}])for(const k in s){d[k]=d[k]||{};for(const g in s[k])d[k][g]=Math.max(+d[k][g]||0,+s[k][g]||0)}
 const vez={...(a.vez||{})};for(const k in b.vez||{})vez[k]=Math.max(+vez[k]||0,+b.vez[k]||0);
 const fa=a.foco,fb=b.foco;let foco=fa||fb;
 if(fa&&fb)foco=fa.id==fb.id?{id:fa.id,base:Math.min(+fa.base||0,+fb.base||0),gasto:Math.max(+fa.gasto||0,+fb.gasto||0),volta:Math.max(+fa.volta||0,+fb.volta||0),
   vezAtual:Math.max(+fa.vezAtual||0,+fb.vezAtual||0),vezSeg:Math.max(+fa.vezSeg||0,+fb.vezSeg||0),vez:((fa.vez||{}).dia||"")>=((fb.vez||{}).dia||"")?fa.vez:fb.vez}:(String(fa.id)>String(fb.id)?fa:fb);
 const r={d,vez,eq:(((a.eq||{}).t||0)>=((b.eq||{}).t||0)?a.eq:b.eq)||{}};if(foco)r.foco=foco;return r}
/* ===== MODO FOCO (o professor liga por turma): cada aula da Academia ou fase NOVA do Robô dá ⚡2;
   cada partida de jogo rápido (Runner, Snake, Defesa, Bomber) gasta ⚡1. Sem limite: quanto mais aulas, mais energia.
   A energia não fica guardada como número: é (aulas+fases concluídas desde que o Foco foi ligado) × 2 − partidas jogadas.
   tempo.foco = {id: quando o professor ligou, base: aulas+fases que o aluno já tinha, gasto: partidas} */
const FOCO_AULA=2,JOGOS_RAPIDOS=["runner","snake","defesa","bomber"],FOCO_CANSADO=.4,FOCO_MIN=15*60,FOCO_VOLTA=180;
/* para o aluno aprender TODOS os jogos, o preço muda: o jogo rápido que ele menos jogou na semana é o "⭐ jogo da vez"
   (custa ⚡1, mas a cada 3 min jogando de verdade a energia volta: na prática é de graça para quem se esforça);
   o jogo que passou de 40% do tempo dele nos jogos rápidos da semana fica "cansado" e custa ⚡2. */
function focoVez(tp){const f=tp.foco,hoje=diaDe(new Date());if(f.vez&&f.vez.dia==hoje&&JOGOS_RAPIDOS.includes(f.vez.g))return f.vez.g;
 const t=tempo7(tp),g=JOGOS_RAPIDOS.slice().sort((x,y)=>t[x]-t[y])[0];f.vez={dia:hoje,g};return g}
function precos(tp){const t=tempo7(tp),T=JOGOS_RAPIDOS.reduce((s,x)=>s+t[x],0),vez=focoVez(tp),o={};
 for(const g of JOGOS_RAPIDOS)o[g]=g==vez?1:(T>=FOCO_MIN&&t[g]/T>FOCO_CANSADO?2:1);return {vez,preco:o}}
const concluidas=(robo,acad)=>{let n=0;const st=(robo&&robo.stars)||{};for(const k in st)if(+st[k]>0)n++;return n+((acad&&acad.done)||[]).length};
function focoDe(pid){const p=(ls("bipsite-profiles")||[]).find(q=>q.id==pid),t=p&&p.cloud&&p.cloud.turma;return t&&t.foco?String(t.foco_em||"ligado"):null}
function energia(pid){const id=focoDe(pid);if(!id)return null;const k=tempoKey(pid),tp=ls(k)||{},n=concluidas(ls("robo4:"+pid),ls("academia-bip-3d-v1:"+pid));
 if(!tp.foco||tp.foco.id!=id)tp.foco={id,base:n,gasto:0};
 const P=precos(tp);try{localStorage.setItem(k,JSON.stringify(tp))}catch(e){}
 const f=tp.foco,ganhou=FOCO_AULA*Math.max(0,n-(+f.base||0)),gasto=+f.gasto||0,volta=+f.volta||0;
 return {id,ganhou,gasto,volta,energia:ganhou-gasto+volta,vez:P.vez,preco:P.preco,vezSeg:+f.vezSeg||0}}
/* chamado a cada 5 s de jogo de verdade (pelo saguão): no jogo da vez, a cada 3 min devolve ⚡1 (no máximo 1 por partida) */
function focoConta(pid,g,s){const e=energia(pid);if(!e||g!=e.vez)return false;const k=tempoKey(pid),tp=ls(k)||{},f=tp.foco;if(!f)return false;
 let volta=false;if(f.vezAtual){f.vezSeg=(+f.vezSeg||0)+s;if(f.vezSeg>=FOCO_VOLTA){f.vezSeg=0;f.vezAtual=0;f.volta=(+f.volta||0)+1;volta=true}}else f.vezSeg=0;
 try{localStorage.setItem(k,JSON.stringify(tp))}catch(e){}return volta}
/* chamado quando uma partida começa: gasta ⚡1. Sem energia, mostra o aviso e a partida não começa. */
function focoGasta(pid,g){const e=energia(pid);if(!e){focoMostra(pid,g);return true}const p=e.preco[g]||1;
 if(e.energia<p){focoSemEnergia(p,e,g);focoMostra(pid,g);return false}
 const k=tempoKey(pid),tp=ls(k)||{};tp.foco.gasto=(+tp.foco.gasto||0)+p;tp.foco.vezAtual=g==e.vez?1:0;tp.foco.vezSeg=0;/* só a partida que acabou de começar pode devolver ⚡1 */
 try{localStorage.setItem(k,JSON.stringify(tp))}catch(e){}focoMostra(pid,g);return true}
const precoTxt=(e,g)=>g==e.vez?`⭐ Este é o seu <b>jogo da vez</b>: a partida gasta ⚡1, mas jogando 3 minutos a energia volta.`

function focoMostra(pid,g){if(typeof document=="undefined")return;const e=energia(pid);

  document.body.appendChild(d);
  d.querySelector("#bipSemVolta").onclick=()=>{d.remove();const a=document.querySelector("a.back");if(a)a.click();else location.href="./"};

 d.querySelector("#bipSemVolta").focus()}
function equilibrio(tp){const t=tempo7(tp),T=JOGOS.reduce((s,g)=>s+t[g],0),eq=(tp&&tp.eq)||{},bloq=eq.bloq||{},media=T/JOGOS.length;
 const vd=eq.vd&&eq.vd.dia==diaDe(new Date())?eq.vd.g:null,/* os jogos da vez ficam fixos o dia inteiro */
  vez=(vd||(T>=600?JOGOS.filter(g=>t[g]<media).sort((x,y)=>t[x]-t[y]).slice(0,2):[])).filter(g=>!bloq[g]);

function gasto(owned,kits){let g=owned.reduce((s,id)=>s+((BYID[id]&&BYID[id].p)||0),0);for(const k in kits||{}){const c=KIT[k];if(!c)continue;const cheio=c.itens.reduce((s,id)=>s+BYID[id].p,0);g-=Math.max(0,Math.min(Math.round(cheio*.25),Math.floor(+kits[k]||0)))}return g}
function saldo(pid){const l=loja(pid),tp=ls(tempoKey(pid)),run=ls(runKey(pid));return ganhos(ls("robo4:"+pid),ls("academia-bip-3d-v1:"+pid),tp?Object.assign({},run||{},{tempo:tp}):run)-gasto(l.owned,l.kits)}

.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--panel));box-shadow:0 4px 0 var(--good)}
.opt.wrong{border-color:var(--bad);opacity:.6;box-shadow:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.blk{border:none;border-radius:12px;padding:8px 13px;color:#fff;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.blk.f{background:var(--go)}.blk.t{background:var(--turn)}.blk.rep{background:var(--loop)}
.prog{display:flex;gap:5px;flex-wrap:wrap;min-height:38px;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:12px;padding:5px 10px;margin-bottom:8px}
.prog span{border-radius:8px;padding:2px 9px;font-weight:700;color:#fff;font-size:.88rem}
.prog .ph{color:var(--muted);font-size:.88rem;font-weight:400}
.readout{font-family:var(--display);font-weight:800;font-size:1.5rem}
.stp{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.stp b{font-size:.85rem}.stp .sn{font-size:1.2rem;min-width:1.4em;text-align:center}
.unlock{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:12px;border-radius:18px;border:2px solid var(--star);background:color-mix(in srgb,var(--star) 14%,var(--panel));animation:pop .5s ease}
.unlock b{font-family:var(--display);font-size:1.2rem}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
input[type=range]{width:min(420px,70vw);accent-color:var(--run)}
.axcard{border:2px solid var(--star);background:color-mix(in srgb,var(--star) 14%,var(--panel));border-radius:18px;padding:12px 22px;text-align:center;box-shadow:0 10px 30px rgba(120,80,0,.18)}
.axcard .k{font-size:.72rem;font-weight:700;letter-spacing:.14em;color:var(--loop)}
.axcard h3{font-family:Georgia,serif;letter-spacing:.06em;font-size:1.4rem;margin:2px 0}
.axcard p{margin:0;font-size:1.05rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;width:100%}
.card{border:2px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center;background:var(--panel);font-family:var(--display);font-weight:800;font-size:1.15rem}
.card small{display:block;font-family:var(--body);font-weight:400;font-size:.82rem;color:var(--muted)}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--star);border-radius:22px;padding:16px 30px;background:color-mix(in srgb,var(--star) 12%,var(--panel));text-align:center;box-shadow:0 10px 30px rgba(120,80,0,.2)}
.badge .medal{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,var(--star) 60%,#b97c00);display:grid;place-items:center;font-size:1.8rem;color:#6b4400;font-family:var(--display);font-weight:800;box-shadow:0 5px 0 #a06c00}
.badge .xp{color:var(--loop);font-weight:700}
.load{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
/* frações empilhadas (3 sobre 4) */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.02;margin:0 .1em;font-family:var(--display);font-weight:800}
.fr i{font-style:normal;padding:0 .16em}
.fr i:first-child{border-bottom:.12em solid currentColor;padding-bottom:.04em}
.opt .fr{font-size:1.05em}
/* contra o chute: espera depois do erro */
.cool{margin-top:8px;font-weight:700;color:var(--bad);font-size:.9rem}
.cool .cb{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin:4px auto 0;max-width:240px}
.cool .cb i{display:block;height:100%;width:100%;background:var(--bad);animation:esvazia linear forwards}
@keyframes esvazia{to{width:0}}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0 8px}
.chip{min-width:42px;height:38px;padding:0 8px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-family:var(--display);font-weight:800}
.chip.on{background:var(--paint);border-color:var(--paint);color:#fff}
.btn.chk{background:var(--go);border-color:var(--go);color:#fff}
.btn:disabled,.chip:disabled{opacity:.5;cursor:not-allowed}
#next.lendo{position:relative;overflow:hidden;opacity:.75}
#next.lendo::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:0;background:rgba(255,255,255,.9);animation:ler var(--rd,3s) linear forwards}
@keyframes ler{to{width:100%}}
.stars{color:var(--star);letter-spacing:2px;font-size:1.3rem;line-height:1}
.stars .off{color:var(--line)}
.les .stars{font-size:.85rem;letter-spacing:1px;margin-left:4px}
.flash{font-weight:800;color:var(--loop);letter-spacing:.04em}
.cristal{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--paint);font-size:.88rem;margin-top:4px}
.cristal i{display:inline-block;width:12px;height:12px;transform:rotate(45deg);background:var(--paint);border-radius:2px}
.soonl{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.soonl small{display:block;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-size:.72rem}

@media (max-width:760px){
 #lesson{padding:8px 10px 10px;gap:8px}
 .ltop .lt{display:none}
 .sayrow .face{width:52px}
 #say{padding:8px 12px}#say .txt{font-size:.98rem}
 .hero{flex-direction:column;text-align:center}.lvl,.axs{justify-content:center}
 .les .ico{display:none}
 .wh .wc{display:none}
 .opt{min-width:64px;font-size:1rem;padding:7px 12px}
 .hintcam{display:none}
 .q{font-size:1.05rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 </div>

<script>
/* =====================================================================
   ACADEMIA DO BIP
   - Cada MUNDO tem AULAS; cada aula tem PASSOS.
   - Passo: m (cara do Bip), t (fala), set() monta a cena, play() anima,
     a (atividade: opt, pick, turn, slider, prog). O botão Prosseguir só
     libera quando a animação termina ou o aluno acerta a atividade.
   - Coordenadas das aulas são as do plano: (x, y), com y "para o fundo".
   ===================================================================== */
const $=id=>document.getElementById(id);
const M=n=>String(n).replace(/-/g,"−");
const D2R=Math.PI/180;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const dark=()=>document.documentElement.dataset.theme=="dark"||(document.documentElement.dataset.theme!="light"&&matchMedia("(prefers-color-scheme: dark)").matches);

/* ---------- Bip 2D (rosto ao lado da fala e no mapa) ---------- */
const FACE2D_BASE=m=>`<svg viewBox="0 0 200 170" style="width:100%;height:auto"><line x1="100" y1="34" x2="100" y2="12" stroke="#3b4250" stroke-width="6" stroke-linecap="round"/><circle cx="100" cy="10" r="9" fill="#ee5f2b"/>
<rect x="18" y="30" width="164" height="124" rx="32" fill="#f2c230" stroke="#b98d10" stroke-width="5"/><rect x="38" y="50" width="124" height="84" rx="20" fill="#172536"/>${FACES[m]||FACES.normal}</svg>`;
const FACES={
 normal:`<rect x="66" y="70" width="18" height="28" rx="9" fill="#5ef0e0"/><rect x="116" y="70" width="18" height="28" rx="9" fill="#5ef0e0"/><path d="M86 112q14 9 28 0" stroke="#5ef0e0" stroke-width="5" fill="none" stroke-linecap="round"/>`,
 feliz:`<path d="M62 92q12-17 24 0M114 92q12-17 24 0" stroke="#5ef0e0" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M80 108q20 17 40 0" stroke="#5ef0e0" stroke-width="6" fill="none" stroke-linecap="round"/>`,
 pensa:`<rect x="72" y="64" width="16" height="22" rx="8" fill="#5ef0e0"/><rect x="122" y="64" width="16" height="22" rx="8" fill="#5ef0e0"/><path d="M88 114h24" stroke="#5ef0e0" stroke-width="5" stroke-linecap="round"/>`,
 ops:`<path d="M64 74l18 18M82 74l-18 18M118 74l18 18M136 74l-18 18" stroke="#ff8a8a" stroke-width="6" stroke-linecap="round"/><circle cx="100" cy="114" r="7" fill="none" stroke="#ff8a8a" stroke-width="5"/>`};
FACES.festa=FACES.feliz;FACES.aponta=FACES.normal;

/* =====================================================================
   MOTOR 3D
   ===================================================================== */
let R,scene,cam,root,fx,floorMat,bigGrid,smallGrid,bip,hemiL,sunL,ok3d=false;
const camS={th:Math.PI/2-.35,ph:.95,r:13.5,tx:0,tz:0},camGoal={...camS};
const P3=(x,y,h=0)=>new THREE.Vector3(x,h,-y);
const mat=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.05,...o});
let runId=0;

function tween(ms,fn){const id=runId;return new Promise(res=>{const t0=performance.now();const f=now=>{if(id!=runId)return res(false);const k=Math.min(1,(now-t0)/ms);fn(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,k);if(k<1)requestAnimationFrame(f);else res(true)};requestAnimationFrame(f)})}
const wait=ms=>{const id=runId;return new Promise(r=>setTimeout(()=>r(id==runId),ms))};

function init3d(){if(ok3d)return true;if(!window.THREE){$("load").textContent="Não foi possível carregar o 3D. Verifique a internet e recarregue a página.";return false}
 R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
 $("cv").appendChild(R.domElement);
 scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(42,1,.1,300);
 hemiL=new THREE.HemisphereLight(0xffffff,0x8b9bb0,.85);scene.add(hemiL);
 const rim=new THREE.DirectionalLight(0xa8c8ff,.45);rim.position.set(-8,9,-12);scene.add(rim);
 const sun=sunL=new THREE.DirectionalLight(0xfff4e0,.8);sun.position.set(6,14,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10});scene.add(sun);
 floorMat=mat(0xf6f8fb,{roughness:.9});const fl=new THREE.Mesh(new THREE.PlaneGeometry(400,400),floorMat);fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;scene.add(fl);
 bigGrid=new THREE.GridHelper(120,120,0xd5dde8,0xe2e8f0);bigGrid.position.y=.002;scene.add(bigGrid);
 smallGrid=new THREE.GridHelper(12,12,0x9fb0c6,0xb9c6d6);smallGrid.position.y=.004;scene.add(smallGrid);
 const edge=new THREE.Mesh(new THREE.RingGeometry(0,0,4),mat(0));edge.visible=false;
 root=new THREE.Group();scene.add(root);fx=new THREE.Group();scene.add(fx);
 bip=makeBip();scene.add(bip.g);
 theme3d();matchMedia("(prefers-color-scheme: dark)").addEventListener("change",theme3d);
 new ResizeObserver(size).observe($("stage"));size();
 setupPointer();
 let last=performance.now();const loop=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;
  for(const k in camGoal)camS[k]+=(camGoal[k]-camS[k])*Math.min(1,dt*4);
  const {th,ph,r,tx,tz}=camS;cam.position.set(tx+r*Math.sin(ph)*Math.cos(th),r*Math.cos(ph),tz+r*Math.sin(ph)*Math.sin(th));cam.lookAt(tx,0,tz);
  bip.tick(dt,now/1000);root.children.forEach(o=>o.userData.tick&&o.userData.tick(now/1000));if(decor&&decor.userData.tick)decor.userData.tick(now/1000);
  for(let i=fx.children.length-1;i>=0;i--){const o=fx.children[i];if(o.userData.step&&o.userData.step(dt)===false){fx.remove(o);o.geometry&&o.geometry.dispose();o.material&&o.material.dispose()}}
  R.render(scene,cam);requestAnimationFrame(loop)};
 requestAnimationFrame(loop);ok3d=true;$("load").remove();return true}
function theme3d(){const d=dark(),W3=curWorld==2,bg=W3?(d?0x0c1a2e:0xbfe3f5):d?0x0e1520:0xe8edf4;scene.background=new THREE.Color(bg);scene.fog=new THREE.Fog(bg,W3?22:18,W3?58:40);
 floorMat.color.setHex(W3?(d?0x1d3a24:0x8fcf6a):d?0x162131:0xf6f8fb);bigGrid.visible=smallGrid.visible=!W3;hemiL.intensity=W3?.6:.85;sunL.intensity=W3?.72:.8;
 [bigGrid,smallGrid].forEach((g,i)=>{const c=d?(i?0x3a4b63:0x223047):(i?0x9fb0c6:0xdbe2ec);[].concat(g.material).forEach(m=>{m.vertexColors=false;m.color.setHex(c);m.needsUpdate=true})})}
function size(){const s=$("stage"),w=s.clientWidth,h=s.clientHeight;if(!w||!h)return;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w/h<1?Math.min(68,42/Math.pow(w/h,.8)):42;cam.updateProjectionMatrix();  /* celular em pé: ângulo de visão mais aberto */
}
function camTo(o){Object.assign(camGoal,o);const w=$("stage").clientWidth;if(w<600&&o.r)camGoal.r=o.r*1.12}

/* Câmera: arrastar gira; toque sem arrastar = escolher ponto no chão */
let onPick=null,onHit=null;
function hitMesh(e){const r=R.domElement.getBoundingClientRect(),v=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
 const rc=new THREE.Raycaster();rc.setFromCamera(v,cam);const h=rc.intersectObjects(root.children,true).find(x=>x.object.type!="Sprite");return h?h.object:null}
function setupPointer(){const el=R.domElement;let down=null,drag=false;
 el.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY,th:camGoal.th,ph:camGoal.ph};drag=false;el.setPointerCapture(e.pointerId)});
 el.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>6)drag=true;
  if(drag){camGoal.th=down.th+dx*.008;camGoal.ph=Math.max(.3,Math.min(1.35,down.ph-dy*.006))}});
 el.addEventListener("pointerup",e=>{if(!down)return;const wasDrag=drag;down=null;if(!wasDrag&&onHit){const m=hitMesh(e);if(m){onHit(m);return}}if(!wasDrag&&onPick){const p=floorAt(e);if(p)onPick(p)}});
 el.addEventListener("wheel",e=>{e.preventDefault();camGoal.r=Math.max(8,Math.min(34,camGoal.r*(1+Math.sign(e.deltaY)*.08)))},{passive:false})}
function floorAt(e){const r=R.domElement.getBoundingClientRect(),v=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
 const rc=new THREE.Raycaster();rc.setFromCamera(v,cam);const hit=new THREE.Vector3();if(!rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),hit))return null;
 const x=Math.round(hit.x),y=Math.round(-hit.z);if(Math.abs(x)>6||Math.abs(y)>6)return null;return [x,y]}

/* ---------- Brilhos e confete ---------- */
let GLOW=null;
function glowTex(){if(GLOW)return GLOW;const c=document.createElement("canvas");c.width=c.height=128;const g=c.getContext("2d"),r=g.createRadialGradient(64,64,0,64,64,64);
 r.addColorStop(0,"rgba(255,255,255,1)");r.addColorStop(.25,"rgba(255,255,255,.55)");r.addColorStop(1,"rgba(255,255,255,0)");g.fillStyle=r;g.fillRect(0,0,128,128);return GLOW=new THREE.CanvasTexture(c)}
function confetti(x,y,n=46){if(!fx)return;const cols=[0xf2c230,0xee5f2b,0x0e8f86,0x6b4fd8,0xd93a7f,0x2f6fd6,0x5fd08a];
 for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(.14,.22),new THREE.MeshBasicMaterial({color:cols[i%cols.length],side:2,transparent:true}));
  m.position.copy(P3(x,y,2.2));const a=Math.random()*Math.PI*2,sp=1.6+Math.random()*2.6,v=new THREE.Vector3(Math.cos(a)*sp,3+Math.random()*3.5,Math.sin(a)*sp),rv=new THREE.Vector3(Math.random()*9,Math.random()*9,Math.random()*9);let life=0;
  m.userData.step=dt=>{life+=dt;v.y-=9.8*dt*.55;v.multiplyScalar(1-dt*.9);m.position.addScaledVector(v,dt);m.rotation.x+=rv.x*dt;m.rotation.y+=rv.y*dt;m.rotation.z+=rv.z*dt;
   if(m.position.y<.02){m.position.y=.02;v.set(0,0,0);rv.set(0,0,0)}m.material.opacity=Math.max(0,1-(life-1.6)/0.8);return life<2.4};fx.add(m)}}

/* ---------- O Bip em 3D ---------- */
function makeBip(){const P=BIPV.buildBody(),{g,inner,body,legs,arms,scr,bulb,glow,halo,s}=P;BIPV.dress(P,myLook());
 const B={g,x:0,y:0,h:0,a:90,walking:0,wv:0,ph:0,mood:"feliz",fix:0,last:0,blinkAt:2,squash:0,
  place(x,y,a){B.x=x;B.y=y;if(a!=null)B.a=a;B.last=performance.now();B.sync()},
  sync(){g.position.copy(P3(B.x,B.y,B.h));g.rotation.y=(B.a+90)*D2R},
  face(m){if(m==B.mood)return;B.mood=m;BIPV.setMood(P,m);if(m=="festa")B.squash=1},
  tick(dt,t){if(!B.walking&&!B.fix&&performance.now()-B.last>900){const ca=Math.atan2(-cam.position.z-B.y,cam.position.x-B.x)/D2R,d=((ca-B.a)%360+540)%360-180;if(Math.abs(d)>1){B.a+=d*Math.min(1,dt*3);B.sync()}}
   /* andar: a força do passo (wv) sobe e desce aos poucos, sem trancos */
   B.wv+=(B.walking-B.wv)*Math.min(1,dt*7);const w=B.wv;B.ph+=dt*10.5*Math.max(w,.0001);
   const sw=Math.sin(B.ph)*.7*w;legs[0].rotation.x=sw;legs[1].rotation.x=-sw;
   let la=-sw*.9,ra=sw*.9,lz=.12,rz=-.12,jump=0,tilt=Math.sin(t*1.3)*.035,nod=0;
   const ease=(cur,goal)=>cur+(goal-cur)*Math.min(1,dt*9);
   if(w<.3){if(B.mood=="aponta"){rz=2.4;ra=-.3+Math.sin(t*3)*.08;tilt=-.08}
    else if(B.mood=="festa"){const j=Math.abs(Math.sin(t*6));lz=-2.6+Math.sin(t*12)*.25;rz=2.6-Math.sin(t*12)*.25;jump=j*.38;nod=-.08}
    else if(B.mood=="pensa"){ra=-1.9;rz=.55;tilt=.14+Math.sin(t*1.6)*.03}
    else if(B.mood=="ops"){lz=-.6;rz=.6;tilt=Math.sin(t*9)*.06}
    else {la=Math.sin(t*1.8)*.06;ra=-Math.sin(t*1.8)*.06}}
   B.arm=B.arm||[0,0,0,0];B.arm=[ease(B.arm[0],la),ease(B.arm[1],lz),ease(B.arm[2],ra),ease(B.arm[3],rz)];
   arms[0].rotation.set(B.arm[0],0,B.arm[1]);arms[1].rotation.set(B.arm[2],0,B.arm[3]);
   B.tl=ease(B.tl||0,tilt);B.nd=ease(B.nd||0,nod+w*.13);body.rotation.z=B.tl;inner.rotation.x=B.nd;
   B.squash=Math.max(0,B.squash-dt*3.5);const sq=Math.sin(B.squash*Math.PI)*.12;
   inner.scale.set(s*(1+sq*.6),s*(1-sq),s*(1+sq*.6));
   body.position.y=Math.sin(t*2.4)*.035+Math.abs(Math.sin(B.ph))*.07*w;inner.position.y=jump;
   const pulse=.5+.5*Math.sin(t*4);glow.intensity=.35+.5*pulse;halo.material.opacity=.45+.4*pulse;
   /* piscar */

const TRI=[[-3,0],[3,0],[0.8,3.5]];
function triAng(){const ang=(p,q,r)=>{const a=[q[0]-p[0],q[1]-p[1]],b=[r[0]-p[0],r[1]-p[1]];return Math.acos((a[0]*b[0]+a[1]*b[1])/Math.hypot(...a)/Math.hypot(...b))/D2R};

function slide(m,x,y,ms=320,h=.6){const a=m.position.clone(),b=P3(x,y,a.y);return tween(ms,(k,l)=>{m.position.lerpVectors(a,b,k);m.position.y=a.y+4*h*l*(1-l)})}

 g.fillStyle=c;g.fillRect(0,0,W,H);g.strokeStyle="rgba(0,0,0,.28)";g.lineWidth=2;for(let i=0;i<=nx;i++){g.beginPath();g.moveTo(i*24,0);g.lineTo(i*24,H);g.stroke()}

   Cenário: a Vila da Partilha (Ilha 1): praça, casas, árvores, padaria, mar e o farol com o cristal.
   Peças novas: bolo e barra cortados em partes, lanternas, moradores robôs e a fração empilhada.

let curWorld=-1,decor=null,cristal=null;
function disposeTree(o){o.traverse(n=>{n.geometry&&n.geometry.dispose();if(n.material)[].concat(n.material).forEach(m=>{m.map&&m.map.dispose();m.dispose()})})}
function setWorld(w){if(w!==curWorld){curWorld=w;if(decor){scene.remove(decor);disposeTree(decor);decor=null;cristal=null}if(w==2){decor=vila();scene.add(decor)}theme3d()}

function lock(sec,after){lockUntil=Date.now()+sec*1000;const id=runId;
 $("act").querySelectorAll("button").forEach(b=>{if(!b.disabled){b.disabled=true;b.dataset.lk=1}});
 const c=$("cool");if(c)c.innerHTML=`<div class="cool">Pense com calma antes de tentar de novo…<div class="cb"><i style="animation-duration:${sec}s"></i></div></div>`;
 setTimeout(()=>{if(id!=runId||solved)return;lockUntil=0;$("act").querySelectorAll("[data-lk]").forEach(b=>{b.disabled=false;delete b.dataset.lk});const c=$("cool");if(c)c.innerHTML="";after&&after()},sec*1000)}
/* quantos pedaços do Cristal do Inteiro (aulas do Mundo 3 concluídas) */
const crystalCount=done=>[...done].filter(k=>k.startsWith("2-")).length;

/* =====================================================================
   AULA: passos e atividades
   ===================================================================== */
let cw=0,cl=0,step=0,solved=false,busy=false;
const LES=()=>WORLDS[cw].L[cl];
function openLesson(w,l){cw=w;cl=l;step=0;errs=0;seen=new Set();vidasOn=!save.done.includes(lid(w,l))&&!window.__semVidas;vidas=3;tentativa=0;busy=false;drawVidas();$("home").classList.add("hidden");$("lesson").classList.remove("hidden");if(!init3d())return;setWorld(w);size();camTo({th:Math.PI/2-.35,ph:.95,r:13.5,tx:0,tz:0});show()}
function closeLesson(){runId++;onPick=null;onHit=null;lockUntil=0;$("lesson").classList.add("hidden");$("home").classList.remove("hidden");drawHome();window.scrollTo(0,0)}
function say(t,cls="",m){const s=$("say");s.className=cls;$("txt").innerHTML=t;s.querySelector(".who").textContent=cls=="ok"?"BIP · ACERTOU!":cls=="no"?"BIP · QUASE!":"BIP";if(m){$("face").innerHTML=FACE2D(m);bip&&bip.face(m)}}
function setMood(m){$("face").innerHTML=FACE2D(m);bip.face(m)}
async function show(){const L=LES(),S=L.steps[step],n=L.steps.length,id=++runId;
 $("lnum").textContent="AULA "+String(cl+1).padStart(2,"0");$("ltit").textContent=`Mundo ${cw+1} · ${L.t}`;
 const pc=Math.round(step/(n-1)*100);$("lbar").style.width=pc+"%";$("lpc").textContent=pc+"%";
 $("back").style.visibility=step?"visible":"hidden";$("next").textContent=S.end?"Concluir aula ✓":"Prosseguir →";
 onPick=null;onHit=null;lockUntil=0;ov("");actP("");clearStage();bip.walking=0;bip.fix=S.fix||(S.a&&/turn|prog/.test(S.a.k))?1:0;
 solved=!S.a;say(S.t,"",S.m);
 if(S.set)S.set();
 if(S.badge){const st=starsFor(errs),k=lid(cw,cl),cr=cw==2?crystalCount(new Set([...save.done,k])):0;
  ov(`<div class="badge${cw==2?" lado":""}"><div class="medal">${S.badge[0]}</div><h2>${S.badge[1]}</h2><div>${S.badge[2]}</div><div class="stars" aria-label="${st} de 3 estrelas">${STARS(st)}</div><small>${errs?errs+(errs>1?" erros":" erro")+" nesta aula"+(st<3?" · refaça para ganhar mais estrelas":""):"Sem nenhum erro!"}</small>${cr?`<div class="cristal"><i></i>Cristal do Inteiro: ${cr}/21</div>`:""}<div class="xp">+${XP_LESSON} ${BIPV.COIN} Bipcoins</div></div>`)}
 if(S.a)setup(S.a,S);
 /* explicação: o "Prosseguir" só libera depois de um tempo mínimo de leitura (na primeira vez que o aluno vê o passo) */
 const need=!S.a&&!S.end&&!window.__semEspera&&!save.done.includes(lid(cw,cl))&&!seen.has(step);
 $("next").disabled=!solved||!!S.play||need;
 const tasks=[];if(S.play)tasks.push(S.play());if(need)tasks.push(readGate(S.t,id));
 if(tasks.length){await Promise.all(tasks);if(id==runId&&!S.a){$("next").disabled=false;seen.add(step)}}else if(!S.a)seen.add(step)}
/* tempo mínimo de leitura: cerca de 4 palavras por segundo, entre 2,5 s e 9 s, com uma barrinha enchendo no botão */
let seen=new Set();
function readGate(t,id){const words=(t.replace(/<[^>]+>/g," ").match(/\S+/g)||[]).length,ms=Math.min(9000,Math.max(2500,words*240)),b=$("next");
 b.style.setProperty("--rd",ms+"ms");b.classList.remove("lendo");void b.offsetWidth;b.classList.add("lendo");
 return new Promise(r=>setTimeout(()=>{b.classList.remove("lendo");r()},ms))}
function win(msg){solved=true;$("next").disabled=false;say(msg,"ok","festa");if(bip)confetti(bip.x,bip.y);const id=runId;setTimeout(()=>{if(id==runId&&solved)setMood("feliz")},1800)}
function miss(msg){errs++;say(msg,"no","ops");
 if(vidasOn&&vidas>0){vidas--;drawVidas();const h=$("lvidas");h.classList.remove("bate");void h.offsetWidth;h.classList.add("bate");if(!vidas){busy=true;const id=runId;setTimeout(()=>{if(id==runId)semVidas()},1800)}}}
/* ---------- vidas: 3 por aula (só na primeira vez; revisar uma aula concluída não tem vidas) ---------- */
let vidas=3,vidasOn=false,tentativa=0;
function drawVidas(){const el=$("lvidas");el.hidden=!vidasOn;if(!vidasOn)return;el.innerHTML=[0,1,2].map(i=>`<span class="${i<vidas?"":"off"}" aria-hidden="true">♥</span>`).join("");el.setAttribute("aria-label",`${vidas} de 3 vidas`)}
function semVidas(){runId++;onPick=null;onHit=null;lockUntil=0;actP("");$("next").disabled=true;$("back").style.visibility="hidden";setMood("ops");
 say("Acabaram as vidas desta aula. Sem problema: vamos recomeçar com mais atenção!","no","ops");
 ov(`<div class="badge"><div class="medal">💔</div><h2>Acabaram as vidas</h2><div>Você errou 3 vezes nesta aula. Ela vai recomeçar do início.<br>As explicações que você já leu ficam liberadas, e as perguntas podem mudar.</div><button class="btn main" id="bRe">↻ Recomeçar a aula</button></div>`);
 $("bRe").onclick=()=>{busy=false;step=0;errs=0;vidas=3;tentativa++;drawVidas();show()};$("bRe").focus()}

function setup(a,S){
 if(a.k=="opt"){const V=[a,...(a.vars||[])];let vi=tentativa%V.length,tries=0;
  /* cada versão da pergunta pode ter o próprio desenho (scene) e uma explicação em 3D quando erra (why) */
  const draw=v=>{if(V.some(x=>x.scene||x.why)){clearStage();S.set&&S.set();(v.scene||(()=>{}))()}};
  const render=()=>{const v=curOpt=V[vi],ord=a.fix?v.o.map((_,i)=>i):shuffle(v.o.map((_,i)=>i));
   actP(`<div class="panel"><div class="q">${v.q}</div><div class="opts">${ord.map(i=>`<button class="opt" data-i="${i}">${v.o[i]}</button>`).join("")}</div><div id="cool"></div></div>`);
   $("act").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(solved||busy||Date.now()<lockUntil)return;const i=+b.dataset.i;
    if(i==v.ans){b.classList.add("right");$("act").querySelectorAll(".opt").forEach(x=>x.disabled=true);win(v.ok)}
    else{b.classList.add("wrong");b.disabled=true;tries++;miss(v.no);if(v.why){clearStage();S.set&&S.set();v.why()}
     lock(tries==1?3:6,()=>{if(V.length>1){vi=(vi+1)%V.length;draw(V[vi]);render();say("Vamos tentar com outra pergunta parecida. "+(V[vi].t||S.t),"",S.m)}})}})};
  {const s0=V[vi].scene;if(s0)s0()}render()}
 if(a.k=="pick"){let pts=[];actP(`<div class="panel tools"><span>Toque no chão · <b id="pc">0</b> de ${a.n}</span><button class="btn sm" id="pclr">Limpar</button></div>`);
  const reset=()=>{const id=runId;clearStage();S.set&&S.set();pts=[];$("pc").textContent=0;say(S.t,"",S.m)};
  $("pclr").onclick=()=>{if(busy||solved)return;runId++;show()};
  onPick=async p=>{if(busy||solved)return;if(pts.some(q=>q[0]==p[0]&&q[1]==p[1]))return say("Esse ponto já foi marcado. Escolha outro lugar.","no","pensa");
   pts.push(p);if(a.mark!==0)pt(a.names?a.names[pts.length-1]:"",p[0],p[1]);$("pc").textContent=pts.length;
   if(pts.length==a.n){busy=true;const r=await a.check(pts);busy=false;if(!r)return;if(r.ok)win(r.msg);else{miss(r.msg);if(a.n>1){const id=runId;await wait(1400);if(id==runId&&!solved){const t=$("txt").innerHTML;runId++;await show();say(t,"no","ops")}}else pts=[]}}}}
 if(a.k=="turn"){let h=bip.a;const base=bip.a;const draw=()=>{const d=((h-base)%360+360)%360;$("tv").textContent=d+"°";clearStage();S.set();bip.place(bip.x,bip.y,h);if(d)arc([0,0],base,base+d,1.4,{txt:d+"°"})};
  actP(`<div class="panel tools"><button class="blk t" id="tl">↺ Girar ${a.step}° (esquerda)</button><span class="readout" id="tv">0°</span><button class="blk t" id="tr">↻ Girar ${a.step}° (direita)</button></div>`);
  const go=async d=>{if(busy||solved)return;busy=true;await bip.turn(d);h+=d;busy=false;draw();const g=((h-base)%360+360)%360;
   if(g==a.target)win(`Isso! Girei <b>${a.target}°</b> para a esquerda (sentido anti-horário) e agora olho para a bandeira.`);else say(`Girei ${g}° no total. Continue até olhar para a bandeira.`,"",S.m)};
  $("tl").onclick=()=>go(a.step);$("tr").onclick=()=>go(-a.step)}
 if(a.k=="slider"){actP(`<div class="panel"><div class="readout"><span id="sv">0°</span> · <span id="st">nulo</span></div><input type="range" min="0" max="180" step="5" value="30" id="sl" aria-label="Abertura do ângulo"></div>`);
  const typ=a=>a==0?"nulo":a<90?"agudo":a==90?"reto":a<180?"obtuso":"raso";
  const upd=()=>{const v=+$("sl").value;clearStage();S.set();pt("",0,0);semi([0,0],[1,0]);semi([0,0],[Math.cos(v*D2R),Math.sin(v*D2R)]);if(v==90)rightMark([0,0],0,.6);else if(v)arc([0,0],0,v,1.5,{txt:v+"°"});
   $("sv").textContent=v+"°";$("st").textContent=typ(v);if(!solved&&a.test(v))win(a.ok)};$("sl").oninput=upd;upd()}
 if(a.k=="step"){const v=(a.init||a.c.map(c=>c[1])).slice();let tries=0;a.check=a.check!==false;
  /* com a.check o aluno aperta "Conferir": não dá para ir apertando + até acertar */
  actP(`<div class="panel">${a.q?`<div class="q">${a.q}</div>`:""}<div class="readout" id="stv"></div><div class="tools">${a.c.map((c,i)=>`<span class="stp"><b>${c[0]}</b><button class="btn sm" data-d="${i}" data-s="-1" aria-label="Menos: ${c[0]}">−</button><span class="readout sn" id="sv${i}">${v[i]}</span><button class="btn sm" data-d="${i}" data-s="1" aria-label="Mais: ${c[0]}">+</button></span>`).join("")}${a.check?`<button class="btn chk" id="chk">Conferir</button>`:""}</div><div id="cool"></div></div>`);
  const upd=()=>{clearStage();S.set&&S.set();a.draw(v);a.c.forEach((c,i)=>$("sv"+i).textContent=v[i]);$("stv").innerHTML=a.txt(v);if(!a.check&&!solved&&a.test(v))win(a.ok(v))};
  $("act").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(solved||Date.now()<lockUntil)return;const i=+b.dataset.d,c=a.c[i];v[i]=Math.max(c[1],Math.min(c[2],v[i]+ +b.dataset.s));upd()});
  if(a.check)$("chk").onclick=()=>{if(solved||Date.now()<lockUntil)return;if(a.test(v))win(a.ok(v));else{tries++;miss(a.no?a.no(v):"Ainda não. Leia a pergunta de novo com calma.");lock(tries==1?3:6)}};upd()}
 if(a.k=="paint"){let P=a.draw();const on=new Set();let tries=0;curPaint=P;
  /* pintar: toque nas peças no 3D ou nos botões numerados; depois "Conferir" */
  actP(`<div class="panel"><div class="q">${a.q}</div><div class="chips">${P.map((p,i)=>`<button class="chip" data-p="${i}" aria-pressed="false" aria-label="Peça ${p.tag||i+1}">${p.tag||i+1}</button>`).join("")}</div><div class="tools"><span class="readout" id="pv"></span><button class="btn chk" id="chk">Conferir</button></div><div id="cool"></div></div>`);
  const sync=()=>{P.forEach((p,i)=>{p.set(on.has(i));const c=$("act").querySelector(`[data-p="${i}"]`);c.classList.toggle("on",on.has(i));c.setAttribute("aria-pressed",on.has(i))});$("pv").innerHTML=a.txt?a.txt(on,P):`${on.size} de ${P.length}`};
  const tog=i=>{if(solved||Date.now()<lockUntil)return;on.has(i)?on.delete(i):on.add(i);sync()};
  $("act").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>tog(+b.dataset.p));
  onHit=m=>{for(let o=m;o&&o!==root;o=o.parent){const i=P.findIndex(p=>p.m===o);if(i>=0)return tog(i)}};
  $("chk").onclick=()=>{if(solved||Date.now()<lockUntil)return;const r=a.test(on,P);if(r===true)win(a.ok);else{tries++;miss(typeof r=="string"?r:a.no);lock(tries==1?3:6)}};sync()}

 if(a.k=="prog"){let list=[],rep=1;const BL=a.blocks,cls={f:"f",t:"t"};
  actP(`<div class="panel"><div class="prog" id="pl"></div><div class="tools">${BL.map((b,i)=>`<button class="blk ${b[1]}" data-b="${i}">${b[0]}</button>`).join("")}<button class="blk rep" id="prep">Repetir tudo: 1×</button><button class="btn sm" id="pclr">Limpar</button><button class="btn main" id="prun" style="font-size:1rem;padding:6px 16px">▶ Executar</button></div></div>`);
  const draw=()=>{$("pl").innerHTML=list.length?(rep>1?`<span style="background:var(--loop)">Repetir ${rep}× [</span>`:"")+list.map(i=>`<span style="background:var(--${BL[i][1]=="f"?"go":"turn"})">${BL[i][0]}</span>`).join("")+(rep>1?`<span style="background:var(--loop)">]</span>`:""):'<span class="ph">Toque nos blocos para montar o programa</span>';$("prep").textContent=`Repetir tudo: ${rep}×`};draw();
  const st={x:bip.x,y:bip.y,a:bip.a};
  $("act").querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{if(busy||solved||list.length>=10)return;list.push(+b.dataset.b);draw()});
  $("prep").onclick=()=>{if(busy||solved)return;rep=rep%6+1;draw()};
  $("pclr").onclick=()=>{if(busy||solved)return;list=[];rep=1;draw();clearStage();S.set&&S.set();bip.place(st.x,st.y,st.a);say(S.t,"",S.m)};
  $("prun").onclick=async()=>{if(busy||solved||!list.length)return;busy=true;clearStage();S.set&&S.set();bip.place(st.x,st.y,st.a);say("Executando…","",S.m);
   const verts=[[st.x,st.y]],turns=[];let pend=0;
   for(let r=0;r<rep;r++)for(const i of list){const [,k,v]=BL[i];
    if(k=="f"){if(pend){turns.push(pend);pend=0}const nx=bip.x+Math.cos(bip.a*D2R)*v,ny=bip.y+Math.sin(bip.a*D2R)*v;if(!(await bip.walk([[nx,ny]],{trail:COL.poly,noTurn:1,ms:300}))){busy=false;return}verts.push([bip.x,bip.y])}
    else{if(!(await bip.turn(v))){busy=false;return}pend+=v}}
   if(pend)turns.push(pend);busy=false;
   const last=verts[verts.length-1],closed=verts.length>2&&Math.hypot(last[0]-verts[0][0],last[1]-verts[0][1])<.01;
   const uniq=[];verts.slice(0,-1).forEach(v=>{if(!uniq.some(u=>Math.hypot(u[0]-v[0],u[1]-v[1])<.01))uniq.push(v)});
   const res={closed,n:closed?verts.length-1:uniq.length};const tr=closed?turns.slice(0,res.n).map(t=>((t%360)+360)%360):turns;
   if(closed&&res.n==uniq.length&&a.check(res,tr)){poly(uniq,{edges:false});win(a.ok)}else miss(a.no)}}}

$("next").onclick=()=>{const L=LES();if(!solved||$("next").disabled)return;
 if(L.steps[step].end){const k=lid(cw,cl),before=new Set(save.done);if(!save.done.includes(k))save.done.push(k);save.stars=save.stars||{};save.stars[k]=Math.max(save.stars[k]||0,starsFor(errs));store();
  const now=new Set(save.done),nx=cw+1;if(WORLDS[nx]&&!worldOpen(nx,before)&&worldOpen(nx,now))unlockMsg=WORLDS[nx].L?`Mundo ${nx+1} liberado: ${WORLDS[nx].t}!`:`Você terminou o Mundo ${cw+1}! O Mundo ${nx+1} (${WORLDS[nx].t}) está chegando.`;
  return closeLesson()}
 step++;show()};
$("back").onclick=()=>{if(busy||!step)return;step--;show()};
$("exit").onclick=closeLesson;
document.addEventListener("keydown",e=>{if($("lesson").classList.contains("hidden")||e.target.tagName=="INPUT")return;if(e.key=="ArrowRight"&&!$("next").disabled)$("next").click();if(e.key=="ArrowLeft")$("back").click();if(e.key=="Escape")closeLesson()});
drawHome();
</script>
</body>
