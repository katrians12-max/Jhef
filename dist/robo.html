<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Robô Programador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: jogo em tela única. Palco 3D à esquerda com o balão do Bip; bancada de peças à direita. No celular, empilha. */
:root{
  --bg:#e8edf4; --panel:#ffffff; --ink:#172536; --muted:#586779; --line:#c3cedc; --ws:#f0f4f9; --dot:#cfd9e6;
  --go:#0e8f86; --turn:#6b4fd8; --loop:#d58200; --cond:#2f6fd6; --paint:#d93a7f; --fn:#2e9960; --run:#ee5f2b;
  --star:#f0ad00; --goal:#1b9a52; --bad:#d23f45; --w:#e8642c; --skin:#f2c230;
  --display:"Baloo 2",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1520; --panel:#172130; --ink:#e8eef6; --muted:#9aa9bb; --line:#2c3a4d; --ws:#111a27; --dot:#253246;
  --go:#1c9e94; --turn:#7a61ee; --loop:#d38b12; --cond:#3f78e0; --paint:#dc4d8d; --fn:#35a66c; --run:#f26a3a;
  --star:#ffc93a; --goal:#38c172; --bad:#ff6b70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1520; --panel:#172130; --ink:#e8eef6; --muted:#9aa9bb; --line:#2c3a4d; --ws:#111a27; --dot:#253246;
  --go:#1c9e94; --turn:#7a61ee; --loop:#d38b12; --cond:#3f78e0; --paint:#dc4d8d; --fn:#35a66c; --run:#f26a3a;
  --star:#ffc93a; --goal:#38c172; --bad:#ff6b70; color-scheme:dark}
html,body{height:100%}
body{box-sizing:border-box;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;overscroll-behavior:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,.pc:focus-visible>.bar{outline:3px solid var(--run);outline-offset:2px}
.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.app{height:100%;max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:0}

/* ---- Barra do topo ---- */
.top{flex:none;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand .bip{width:38px;height:35px;flex:none}
h1{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1;margin:0;letter-spacing:-.01em;white-space:nowrap}
h1 span{color:var(--run)}
.lvnav{flex:1;display:flex;justify-content:center;align-items:stretch;gap:6px;min-width:0}
.iconbtn{width:42px;height:42px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--panel);cursor:pointer;font-size:1.05rem}
.iconbtn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.iconbtn:disabled{opacity:.35;cursor:default}
.lvcur{min-width:0;max-width:440px;flex:1;display:flex;align-items:center;gap:10px;border-radius:12px;border:2px solid var(--w);border-bottom-width:4px;background:var(--panel);cursor:pointer;padding:3px 12px 3px 5px;text-align:left}
.lvcur:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.wbadge{flex:none;width:32px;height:32px;border-radius:9px;background:var(--w);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.05rem}
.lvtxt{min-width:0;display:flex;flex-direction:column;line-height:1.15}
.lvtxt small{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvtxt b{font-family:var(--display);font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvcur .i{margin-left:auto;color:var(--muted)}
.tools{display:flex;align-items:center;gap:6px}
.starct{height:42px;display:inline-flex;align-items:center;gap:6px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--panel);padding:0 12px;cursor:pointer;font-family:var(--display);font-weight:800;font-size:1.05rem}
.starct .i{color:var(--star)}
.starct small{font-family:var(--mono);font-weight:500;font-size:.72rem;color:var(--muted)}

/* ---- Palco ---- */
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,1fr);gap:14px}
.stage{min-height:0;display:flex;flex-direction:column;gap:8px}
.talk{flex:none;display:flex;align-items:flex-start;gap:10px}
.face{flex:none;width:58px;height:54px;margin-top:2px}
.face .bip{width:100%;height:100%;display:block}
.talk.shake .face{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-5px) rotate(-6deg)}50%{transform:translateX(5px) rotate(6deg)}80%{transform:translateX(-3px)}}
.bubble{position:relative;flex:1;min-width:0;min-height:58px;box-sizing:border-box;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:7px 12px 8px;display:flex;flex-direction:column;gap:3px;justify-content:center}
.bubble::before{content:"";position:absolute;left:-9px;top:18px;width:14px;height:14px;background:var(--panel);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg);border-radius:0 0 0 3px}
.bubble.fail,.bubble.fail::before{border-color:var(--bad)}
.bubble.ok,.bubble.ok::before{border-color:var(--goal)}
.bubble.tip,.bubble.tip::before{border-color:var(--star)}
.bhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lvtag{background:var(--ink);color:var(--panel);font-family:var(--display);font-weight:600;font-size:.82rem;border-radius:999px;padding:1px 10px}
.kind{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 8px;color:var(--w);background:color-mix(in srgb,var(--w) 14%,var(--panel))}
.bubble p{margin:0;font-size:.92rem;line-height:1.35}
.bubble.fail p b,.bubble.ok p b{font-family:var(--display)}
.blinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.link{border:none;background:transparent;padding:2px 0;cursor:pointer;color:var(--cond);font-weight:700;font-size:.82rem;text-decoration:underline;text-underline-offset:2px}
.tipbtn{flex:none;align-self:center;display:inline-flex;align-items:center;gap:5px;border-radius:12px;border:2px solid var(--star);border-bottom-width:4px;background:color-mix(in srgb,var(--star) 16%,var(--panel));padding:6px 10px;cursor:pointer;font-family:var(--display);font-weight:600}
.tipbtn:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.board{position:relative;flex:1;min-height:0;border:2px solid var(--line);border-radius:16px;overflow:hidden;touch-action:none;cursor:grab;background:var(--ws)}
.board canvas{display:block;width:100%!important;height:100%!important}
.hud{position:absolute;left:8px;top:8px;right:8px;display:flex;flex-wrap:wrap;gap:5px;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--panel) 90%,transparent);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:.8rem;box-shadow:0 1px 3px rgba(10,20,35,.22);white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:500}
.chip .i{color:var(--muted)}
.chip.keyc .i{color:var(--kc)}
.chip.keyc.off{opacity:.55}
.vars{margin-left:auto;display:inline-flex;align-items:center;gap:4px;pointer-events:auto;background:color-mix(in srgb,var(--panel) 90%,transparent);border-radius:999px;padding:3px 6px 3px 10px;font-size:.8rem;box-shadow:0 1px 3px rgba(10,20,35,.22)}
.vchip{min-width:26px;height:24px;border-radius:999px;border:2px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:.75rem;cursor:pointer;padding:0 6px}
.vchip.on{border-color:var(--ink)}
.vchip.run{border-color:var(--run);background:color-mix(in srgb,var(--run) 18%,var(--panel))}
.vchip.ok{border-color:var(--goal);background:var(--goal);color:#fff}
.vchip.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--panel));color:var(--bad)}
.hint3d{position:absolute;left:10px;bottom:8px;font-size:.72rem;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none;opacity:.85}
.err3d{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted)}

/* ---- Bancada ---- */
.bench{min-height:0;display:flex}
.card{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:9px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px}
.chead{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px}
.chead h2{font-family:var(--display);font-size:1.05rem;margin:0;line-height:1.1}
.meter{display:flex;flex-wrap:wrap;gap:5px;font-size:.78rem}
.meter span{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;background:var(--ws);color:var(--muted);white-space:nowrap}
.meter b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.meter .par .i{color:var(--star);width:.95em;height:.95em}
.meter .over{background:color-mix(in srgb,var(--bad) 16%,var(--panel));color:var(--bad)}
.meter .over b{color:var(--bad)}
.editor{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.palette{position:relative;display:flex;flex-direction:column;gap:14px;padding:10px 10px 16px;background:var(--ws);border-radius:12px;overflow:auto;--hole:var(--ws);align-content:start}
.palette .pc{min-width:136px}
.palette.trash::after{content:"Solte aqui para apagar";position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;
  background:color-mix(in srgb,var(--bad) 90%,transparent);color:#fff;font-family:var(--display);font-weight:800;font-size:1.02rem;z-index:5}
.ws{position:relative;min-height:0;overflow:auto;background-color:var(--ws);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:18px 18px;border-radius:12px;padding:12px 12px 26px;--hole:var(--ws);display:flex;flex-flow:row wrap;gap:22px 26px;align-items:flex-start;align-content:flex-start}
.stack{display:flex;flex-direction:column;align-items:flex-start;max-width:100%}
.list{display:flex;flex-direction:column;align-items:flex-start;min-width:150px}
.stack>.list{min-height:14px}
.pc{--c:var(--go);position:relative;display:inline-grid;grid-template-columns:max-content;width:max-content;min-width:150px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.k-go{--c:var(--go)}.k-turn{--c:var(--turn)}.k-loop{--c:var(--loop)}.k-cond{--c:var(--cond)}.k-paint{--c:var(--paint)}.k-fn{--c:var(--fn)}.k-run{--c:var(--run)}
.pc.hat{cursor:default}
.stack.pick .pc.hat{cursor:pointer}
.pc::before{content:"";position:absolute;top:0;left:16px;width:26px;height:8px;background:var(--hole);border-radius:0 0 7px 7px;z-index:1}
.pc::after{content:"";position:absolute;bottom:-8px;left:16px;width:26px;height:8px;background:color-mix(in srgb,var(--c) 82%,#000);border-radius:0 0 7px 7px;z-index:2}
.pc.hat::before{display:none}
.bar{position:relative;white-space:nowrap;box-sizing:border-box;background:var(--c);color:#fff;min-height:44px;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-radius:8px;
  box-shadow:inset 0 -4px 0 color-mix(in srgb,#000 18%,transparent);font-family:var(--display);font-weight:600;font-size:1rem;text-shadow:0 1px 0 color-mix(in srgb,#000 25%,transparent)}
.pc.hat .bar{border-radius:20px 20px 8px 8px;padding:9px 14px 6px 12px}
.ico{width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,#fff 24%,transparent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ico .i{width:15px;height:15px;stroke-width:2.8;vertical-align:0}
.ico.let{font-family:var(--display);font-weight:800;font-size:1rem;background:#fff;color:var(--c);text-shadow:none}
.bar .x{margin-left:auto;background:transparent;border:none;color:#fff;cursor:pointer;opacity:.75;padding:5px;border-radius:6px;display:inline-flex}
.bar .x .i{width:14px;height:14px;stroke-width:3}
.bar .x:hover{opacity:1;background:color-mix(in srgb,#000 16%,transparent)}
.cblock .cap{border-radius:8px 8px 8px 0}
.cblock .cap::after,.bar.mid::after{content:"";position:absolute;bottom:-8px;left:34px;width:26px;height:8px;background:color-mix(in srgb,var(--c) 82%,#000);border-radius:0 0 7px 7px;z-index:2}
.mouth{display:flex}
.mouth::before{content:"";width:18px;flex:none;background:var(--c)}
.mouth>.list{padding:0 0 8px;min-width:120px}
.bar.mid{min-height:30px;border-radius:0 8px 8px 0;padding:4px 12px;font-size:.9rem}
.foot{height:20px;background:var(--c);border-radius:0 8px 8px 8px;box-shadow:inset 0 -4px 0 color-mix(in srgb,#000 18%,transparent)}
.cnd{border:none;border-radius:999px;background:#fff;color:#172536;font-family:var(--body);font-weight:700;font-size:.82rem;padding:5px 10px;cursor:pointer;text-shadow:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.14);display:inline-flex;align-items:center;gap:3px}
.cnd .i{width:12px;height:12px;stroke-width:3}
.st{display:flex;align-items:center;gap:3px;background:color-mix(in srgb,#000 16%,transparent);border-radius:999px;padding:2px}
.st button{width:26px;height:26px;border-radius:50%;border:none;background:color-mix(in srgb,#fff 30%,transparent);color:#fff;font-weight:800;cursor:pointer;line-height:1;font-size:1rem}
.st .cnt{font-family:var(--mono);min-width:1.4em;text-align:center}
.slot{margin:10px 6px 2px;min-height:32px;min-width:120px;box-sizing:border-box;border:2px dashed color-mix(in srgb,var(--c) 75%,transparent);border-radius:8px;color:var(--muted);font-size:.78rem;display:flex;align-items:center;justify-content:center;padding:0 8px}
.list:has(> .ph) > .slot{display:none}
.ph{height:44px;width:150px;box-sizing:border-box;border:2px dashed var(--run);border-radius:8px;background:color-mix(in srgb,var(--run) 14%,transparent);margin:6px 0}
.mouth .ph{margin:10px 0 2px}
.dragging{display:none!important}
.ghost{position:fixed;left:0;top:0;z-index:80;pointer-events:none;opacity:.95;filter:drop-shadow(0 10px 14px rgba(0,0,0,.3));--hole:transparent}
.ghost.nope{filter:grayscale(1) opacity(.6)}
.bar.run{box-shadow:inset 0 -4px 0 color-mix(in srgb,#000 18%,transparent),0 0 0 3px var(--panel),0 0 0 6px var(--run)}
.bar.call{box-shadow:inset 0 -4px 0 color-mix(in srgb,#000 18%,transparent),0 0 0 3px var(--panel),0 0 0 6px color-mix(in srgb,var(--fn) 70%,#fff)}
.bar.yes{box-shadow:inset 0 -4px 0 color-mix(in srgb,#000 18%,transparent),0 0 0 3px var(--panel),0 0 0 6px var(--goal)}
.bar.no{box-shadow:inset 0 -4px 0 color-mix(in srgb,#000 18%,transparent),0 0 0 3px var(--panel),0 0 0 6px var(--muted)}
.bar[data-res]::before{content:attr(data-res);position:absolute;right:-8px;top:-12px;z-index:4;font-family:var(--display);font-size:.8rem;line-height:1;padding:4px 8px;border-radius:999px;color:#fff;background:var(--goal);text-shadow:none}
.bar.no[data-res]::before{background:var(--muted)}
.bar.pulse{filter:brightness(1.18)}
.bar.err{box-shadow:inset 0 -4px 0 color-mix(in srgb,#000 18%,transparent),0 0 0 3px var(--panel),0 0 0 6px var(--bad)}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
.pc.new>.bar{animation:pop .2s ease-out}
.pc.lift>.bar{transform:scale(1.04);box-shadow:inset 0 -4px 0 color-mix(in srgb,#000 18%,transparent),0 6px 14px rgba(0,0,0,.25);transition:transform .12s}
.empty{color:var(--muted);font-size:.85rem;margin:12px 2px 0;max-width:32ch;line-height:1.35}
.stack.active>.pc.hat .bar::after{content:"";position:absolute;left:-9px;top:50%;margin-top:-6px;border:6px solid transparent;border-left-color:var(--c)}
.stack.active>.pc.hat .bar{box-shadow:inset 0 -4px 0 color-mix(in srgb,#000 18%,transparent),0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent)}
.stack.locked .pc{cursor:default}
.stack.locked .x,.ws.ro .x{display:none}
.ws.ro .pc{cursor:default}
.ws.ro .st button,.ws.ro .cnd .i,.stack.locked .st button,.stack.locked .cnd .i{display:none}
.ws.ro .cnd,.stack.locked .cnd{cursor:default}
.lockn{font-family:var(--body);font-weight:700;font-size:.72rem;background:color-mix(in srgb,#000 22%,transparent);border-radius:999px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px;text-shadow:none}
.lockn .i{width:12px;height:12px}

/* ---- Respostas das fases de leitura ---- */
.answers{flex:none;display:flex;flex-direction:column;gap:8px;background:var(--ws);border-radius:12px;padding:10px 12px}
.answers p{margin:0;font-family:var(--display);font-weight:600;font-size:1.02rem}
.ansrow{display:flex;gap:8px;flex-wrap:wrap}
.ans{flex:1;min-width:64px;height:54px;border-radius:14px;border:none;border-bottom:5px solid color-mix(in srgb,var(--oc) 70%,#000);background:var(--oc);color:#fff;font-family:var(--display);font-weight:800;font-size:1.6rem;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.ans:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px;margin-bottom:3px}
.ans:disabled{opacity:.3;cursor:default;text-decoration:line-through}

/* ---- Controles ---- */
.ctrls{flex:none;display:flex;align-items:stretch;gap:7px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line);border-bottom-width:4px;background:var(--panel);color:var(--ink);border-radius:12px;padding:7px 13px;font-family:var(--display);font-weight:600;font-size:1rem;cursor:pointer;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.btn.primary{background:var(--run);border-color:color-mix(in srgb,var(--run) 72%,#000);color:#fff;min-width:132px;font-size:1.08rem}
.btn.primary.stop{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sq{padding:7px 10px;min-width:42px}
.grow{flex:1}
.spd{font-family:var(--mono);font-weight:500;min-width:50px}

/* ---- Janelas ---- */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(8,14,24,.55);padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.sheet{position:relative;box-sizing:border-box;width:min(560px,100%);max-height:100%;overflow:auto;background:var(--panel);border-radius:22px;border:2px solid var(--line);padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(18px) scale(.97);opacity:0}}
.sheet h2{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.1;margin:0;text-wrap:balance}
.sheet p{margin:0;line-height:1.45}
.closex{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:10px;border:none;background:var(--ws);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
/* vitória */
.win{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden}
.win .bip{width:92px;height:84px}
.wstars{display:flex;gap:6px;align-items:flex-end;height:66px}
.wstars .i{width:52px;height:52px;color:var(--line);stroke:none;transform:scale(.6);opacity:.5;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s,color .2s}
.wstars .i:nth-child(2){width:64px;height:64px}
.wstars .i.on{color:var(--star);transform:scale(1);opacity:1;filter:drop-shadow(0 3px 0 color-mix(in srgb,var(--star) 60%,#000))}
.win p{color:var(--muted);max-width:42ch}

/* Enquadramento: a menor distância em que o tabuleiro inteiro cabe na tela, em qualquer formato e giro,

 const add=(x,y,z,mx,mt,mb)=>pts.push({f:-x*sa*ce-y*se-z*ca*ce,x:x*ca-z*sa,y:-x*sa*se+y*ce-z*ca*se,ax:th*mx,at:tv*mt,ab:tv*mb});
 for(const sx of[-1,1])for(const sz of[-1,1]){add(sx*sw,-.12-TY,sz*sd,.97,.97,.9);add(sx*sw,-.72-TY,sz*sd,1.2,1.2,.99);add(sx*bw,1.25-TY,sz*bd,.95,top,.95)}

/* ===== Editor de peças de encaixar ===== */
const PIECE={F:{k:"go",i:"up",n:"Frente"},J:{k:"go",i:"jump",n:"Pular"},L:{k:"turn",i:"turnL",n:"Esquerda"},R:{k:"turn",i:"turnR",n:"Direita"},P:{k:"paint",i:"brush",n:"Pintar"},
 loop:{k:"loop",i:"repeat",n:"Repetir"},until:{k:"loop",i:"until",n:"Repetir até"},if:{k:"cond",i:"split",n:"Se"},fa:{k:"fn",l:"A",n:"Peça A"},fb:{k:"fn",l:"B",n:"Peça B"}};
const ORDER=["F","J","L","R","P","loop","until","if","fa","fb"];
const CONDS={front:"caixa na frente",left:"caixa à esquerda",right:"caixa à direita",hole:"buraco na frente",goal:"chegar na bandeira"};
const condList=b=>b.t=="until"?["goal","front"]:["front","left","right"].concat(hasHoles?["hole"]:[]);
const icoOf=t=>{const p=PIECE[t];return p.l?`<span class="ico let">${p.l}</span>`:`<span class="ico">${ic(p.i)}</span>`};
const palettePiece=t=>`<div class="pc k-${PIECE[t].k}" data-t="${t}" tabindex="0" role="button" aria-label="Adicionar a peça ${PIECE[t].n}"><div class="bar">${icoOf(t)}${PIECE[t].n}</div></div>`;

function drawPalette(){const L=LEVELS[lvl],kit=kitOf(L),el=$("palette"),quiz=L.type=="quiz";
 el.hidden=quiz;el.parentNode.classList.toggle("solo",quiz);
 const list=ORDER.filter(t=>kit.includes(t));el.innerHTML=list.map(palettePiece).join("");
 const n=quiz?0:list.length;el.style.setProperty("--cols",n<=4?Math.max(1,n):Math.ceil(n/2));document.body.classList.toggle("many",n>4)}

function pieceHTML(b){const p=PIECE[b.t],nw=b.id==fresh?" new":"",x=`<button class="x" data-del="${b.id}" aria-label="Remover peça">${ic("x")}</button>`;
 const mouth=(list,key,txt)=>`<div class="mouth"><div class="list" data-list="${key}">${list.length?list.map(pieceHTML).join(""):`<div class="slot">${txt}</div>`}</div></div>`;
 const chip=()=>`<button class="cnd" data-cond="${b.id}" aria-label="Trocar a condição">${CONDS[b.c]}${ic("down")}</button>`;
 if(b.t=="loop")return `<div class="pc cblock k-loop${nw}" data-id="${b.id}"><div class="bar cap" id="b${b.id}">${icoOf("loop")}Repetir<span class="st"><button data-dec="${b.id}" aria-label="Repetir menos vezes">−</button><span class="cnt">${b.n}</span><button data-inc="${b.id}" aria-label="Repetir mais vezes">+</button></span>vezes${x}</div>${mouth(b.body,b.id,"encaixe peças aqui")}<div class="foot"></div></div>`;
 if(b.t=="until")return `<div class="pc cblock k-loop${nw}" data-id="${b.id}"><div class="bar cap" id="b${b.id}">${icoOf("until")}Repetir até${chip()}${x}</div>${mouth(b.body,b.id,"encaixe peças aqui")}<div class="foot"></div></div>`;
 if(b.t=="if")return `<div class="pc cblock k-cond${nw}" data-id="${b.id}"><div class="bar cap" id="b${b.id}">${icoOf("if")}Se${chip()}então${x}</div>${mouth(b.body,b.id,"se sim, faça isto")}<div class="bar mid">senão</div>${mouth(b.els,b.id+":e","se não, faça isto")}<div class="foot"></div></div>`;

/* Pilhas do programa: "Ao executar" e, quando a fase permite, as receitas das Peças A e B. */
function stacksOf(){const kit=kitOf(LEVELS[lvl]);return ["m"].concat(kit.includes("fa")||P.A.length?["A"]:[],kit.includes("fb")||P.B.length?["B"]:[])}
const isLocked=key=>key=="A"&&!!LEVELS[lvl].lockFn;
function stackHTML(key){const fn=key!="m",locked=isLocked(key),list=P[key],quiz=LEVELS[lvl].type=="quiz";

  :`<div class="pc hat k-run"><div class="bar"><span class="ico">${ic("play")}</span>Ao executar</div></div>`;
 const empty=list.length||quiz?"":fn?`<p class="empty">Monte aqui a receita da Peça ${key}. Depois use a Peça ${key} no programa.</p>`
  :`<p class="empty"><span class="dsk">Arraste as peças e encaixe aqui embaixo. Para apagar uma peça, arraste de volta para a coluna de peças.</span><span class="mob">Toque numa peça acima para começar. Para mudar uma peça de lugar, segure e arraste.</span></p>`;
 return `<div class="stack${fn?" fn":""}${locked?" locked":""}${multi&&!locked&&!quiz?" pick":""}${multi&&key==active&&!quiz?" active":""}" data-stack="${key}">${hat}<div class="list" data-list="${key}">${list.map(pieceHTML).join("")}</div>${empty}</div>`}
function drawProg(){const L=LEVELS[lvl],ws=$("ws"),ks=stacksOf();multi=ks.filter(k=>!isLocked(k)).length>1;if(!ks.includes(active)||isLocked(active))active="m";

function find(id,lists=[P.m,P.A,P.B]){for(const list of lists)for(const b of list){if(b.id==id)return [b,list];for(const sub of[b.body,b.els])if(sub){const f=find(id,[sub]);if(f)return f}}}
function listOf(key){if(key=="m"||key=="A"||key=="B")return P[key];const [id,e]=String(key).split(":"),f=find(id);return f?(e?f[0].els:f[0].body):P.m}
function callsIn(b,acc=new Set()){if(b.t=="fa"||b.t=="fb")acc.add(b.t);for(const sub of[b.body,b.els])if(sub)sub.forEach(x=>callsIn(x,acc));return acc}
const editable=()=>!running&&LEVELS[lvl].type!="quiz";

/* Desfazer: guarda uma cópia do programa antes de cada mudança */
let undoStack=[];
function snap(){undoStack.push(JSON.stringify(P));if(undoStack.length>60)undoStack.shift();$("undo").disabled=false}
function undo(){if(!editable()||!undoStack.length)return;P=JSON.parse(undoStack.pop());$("undo").disabled=!undoStack.length;Snd.click();changed()}
function changed(){const t=LEVELS[lvl].t;drafts[t]=P;save.draft={t,p:P};persist();if(state.moved)resetBoard();showMission();drawProg()}
/* Programa guardado (ao recarregar a página): confere as peças e dá números novos a elas. */
function reviveProg(p){try{const ok=l=>Array.isArray(l)&&l.every(b=>b&&PIECE[b.t]&&(b.t!="loop"||(b.n>=2&&b.n<=9))&&(!("c" in b)||CONDS[b.c])&&(b.body?ok(b.body):!["loop","until","if"].includes(b.t))&&(b.t!="if"||ok(b.els)));
  if(!p||!ok(p.m)||!ok(p.A)||!ok(p.B))return null;const q=JSON.parse(JSON.stringify(p)),re=l=>l.forEach(b=>{b.id=++uid;if(b.body)re(b.body);if(b.els)re(b.els)});re(q.m);re(q.A);re(q.B);return q}catch(e){return null}}

document.addEventListener("click",e=>{const t=e.target.closest("button");
 if(!t){const h=e.target.closest(".stack.pick>.pc.hat");if(h&&editable()){active=h.parentNode.dataset.stack;Snd.click();drawProg();const st=document.querySelector(`#ws .stack[data-stack="${active}"]`);if(st)st.scrollIntoView({block:"nearest"})}return}
 const d=t.dataset;
 if(d.l!=null){closeModals();return loadLevel(+d.l)}

 if(d.del){snap();const[b,l]=find(d.del);l.splice(l.indexOf(b),1);Snd.del();return changed()}
 if(d.inc||d.dec){const[b]=find(d.inc||d.dec),n=clamp(b.n+(d.inc?1:-1),2,9);if(n!=b.n){snap();b.n=n;Snd.click();changed()}return}
 if(d.cond){snap();const[b]=find(d.cond),ks=condList(b);b.c=ks[(ks.indexOf(b.c)+1)%ks.length];Snd.click();return changed()}});

/* ---- Arrastar e soltar ---- */
const newBlock=t=>t=="loop"?{id:++uid,t,n:2,body:[]}:t=="until"?{id:++uid,t,c:"goal",body:[]}:t=="if"?{id:++uid,t,c:"front",body:[],els:[]}:{id:++uid,t};

/* Enquanto arrasta perto da borda de cima ou de baixo (ou além dela), a área do programa rola sozinha. */

 if(x>r.left-20&&x<r.right+20){const dn=y-(r.bottom-46),up=(r.top+46)-y,v=dn>0?Math.min(16,2+dn*.3):up>0&&y>r.top-60?-Math.min(16,2+up*.3):0;

 const st=quiz?3-Math.min(2,(quizMiss[L.t]||new Set()).size):!L.par||n<=L.par?3:n<=L.par+Math.max(2,Math.round(L.par*.3))?2:1;
 if(st>(save.stars[L.t]||0))save.stars[L.t]=st;delete save.skip[L.t];persist();drawTop();say("Missão cumprida!","happy","ok",[["mission","Ver a missão"]]);
 const after=totalStars(),skin=save.all?null:Object.keys(SKIN_AT).filter(k=>SKIN_AT[k]>before&&SKIN_AT[k]<=after).pop(),rank=rankOf(after)[0]>before?rankOf(after)[1]:null;showWin(st,n,nv,skin,rank)}
function skipLevel(){save.skip[LEVELS[lvl].t]=1;persist();Snd.click();loadLevel(lvl+1,{force:1})}

/* ---------- Janelas: vitória, novo mundo, mapa e opções ---------- */
function openModal(id){closeModals();const m=$(id);m.hidden=false;const f=m.querySelector("[data-focus]")||m.querySelector("button");if(f)f.focus({preventScroll:true})}
function closeModals(){document.querySelectorAll(".modal").forEach(m=>m.hidden=true)}
function showWin(st,n,nv,skin,rank){const L=LEVELS[lvl],last=lvl==LEVELS.length-1,quiz=L.type=="quiz",genius=!quiz&&L.par&&n<L.par;
 const title=last?"Você completou o jogo!":genius?"Genial!":st==3?"Perfeito!":st==2?"Muito bem!":"Conseguiu!";let txt;
 if(quiz)txt=st==3?"Você leu o programa com atenção e acertou de primeira.":"Você acertou! Nas fases de leitura, as 3 estrelas são para quem acerta na primeira tentativa.";
 else if(genius)txt=`Seu programa tem <b>${pcs(n)}</b>: menos do que as ${L.par} que valem 3 estrelas. Você achou um caminho mais curto que o do Bip!`;
 else if(st==3)txt=`Missão cumprida com <b>${pcs(n)}</b>${nv>1?`, e o mesmo programa funcionou nos ${nv} mapas`:""}.`;
 else txt=`Seu programa tem <b>${pcs(n)}</b>. Para ganhar 3 estrelas, use <b>${L.par} ou menos</b>. Será que dá para encurtar?`;
 if(last)txt+=" Todas as fases do Robô Programador foram vencidas. Parabéns!";else if(L.n==WORLDS[L.w].lv.length)txt+=` Você terminou o mundo <b>${WORLDS[L.w].n}</b>!`;
 $("winSheet").innerHTML=`<div class="confetti" id="confetti"></div>${bip("happy")}<div class="wstars">${ic("star")}${ic("star")}${ic("star")}</div><h2>${title}</h2><p>${txt}</p>`+
  (rank?`<div class="prize">${ic("bolt")}<span>Novo nível: <b>${rank}</b></span></div>`:"")+
  (skin?`<div class="prize"><i class="sw" style="--sc:${SKINS[skin]}"></i><span>Nova cor do Bip liberada: <b>${SKIN_NAME[skin]}</b></span><button class="link" data-wear="${skin}">Usar agora</button></div>`:"")+`<div class="wbtns">`+
  (st<3&&!quiz?`<button class="btn" data-act="close">Tentar com menos peças</button>`:"")+(last?`<button class="btn primary" data-act="map" data-focus>Ver o mapa</button>`:`<button class="btn primary" data-act="next" data-focus>Próxima fase${ic("right")}</button>`)+`</div>`;
 openModal("winModal");[...$("winSheet").querySelectorAll(".wstars .i")].forEach((s,i)=>{if(i<st)setTimeout(()=>{s.classList.add("on");Snd.pop(i)},350+i*320)});
 if(!reduce){const cols=["#f0ad00","#ee5f2b","#2f6fd6","#1b9a52","#d93a7f","#6b4fd8"];let h="";for(let i=0;i<40;i++)h+=`<i style="left:${Math.random()*100}%;background:${cols[i%6]};animation-delay:${Math.random()*.6}s;animation-duration:${1.4+Math.random()}s"></i>`;$("confetti").innerHTML=h}}
function showIntro(wi){const W=WORLDS[wi],sh=$("introSheet");sh.style.setProperty("--w",W.ac);
 sh.innerHTML=`<span class="wnum">${ic(W.ic)}Mundo ${wi+1}</span><h2>${W.n}</h2><p>${esc(W.txt)}</p><div class="newpcs">${(W.show||[]).map(palettePiece).join("")}</div><button class="btn primary" data-act="close" data-focus>Vamos lá!</button>`;openModal("introModal")}
function drawMap(){let h=`<button class="closex" data-act="close" aria-label="Fechar">${ic("x")}</button><div class="maphead"><h2>Mapa de fases</h2><span class="tot">${ic("star")}${totalStars()} de ${LEVELS.length*3}</span><span class="rank">${ic("bolt")}${rankOf(totalStars())[1]}</span></div><div class="worlds">`;
 WORLDS.forEach((W,wi)=>{const ws=W.lv.reduce((a,l)=>a+(save.stars[l.t]||0),0);
  h+=`<section class="world${unlocked(W.from)?"":" locked"}" style="--w:${W.ac}"><h3><span class="wbadge">${wi+1}</span>${W.n}<small>${ic("star")}${ws}/${W.lv.length*3}</small></h3><div class="chips">`;
  for(const l of W.lv){const st=save.stars[l.t]||0,lock=!unlocked(l.i),kind=l.type=="quiz"?"leitura":l.type=="fix"?"conserto":"";
   h+=`<button class="lv${l.i==lvl?" on":""}${st?" done":""}${save.skip[l.t]&&!st?" skip":""}" data-l="${l.i}" ${lock?"disabled":""} title="${esc(lock?"Complete a fase anterior":l.t)}" aria-label="Fase ${l.n}: ${esc(l.t)}${kind?" ("+kind+")":""}${lock?", bloqueada":", "+st+" de 3 estrelas"}">`+
    (lock?ic("lock"):`<b>${l.n}</b><span class="pips">${[1,2,3].map(k=>ic("star",k<=st?"on":"")).join("")}</span>`)+(kind&&!lock?`<span class="tg">${ic(l.type=="quiz"?"eye":"wrench")}</span>`:"")+`</button>`}
  h+=`</div></section>`});
 $("mapSheet").innerHTML=h+`</div><div class="legend"><span><span class="tg">${ic("eye")}</span>leitura: prever o que o programa faz</span><span><span class="tg">${ic("wrench")}</span>conserto: achar e arrumar o erro</span></div>`}
function drawCfg(ask){$("cfgSheet").innerHTML=`<button class="closex" data-act="close" aria-label="Fechar">${ic("x")}</button><h2>Opções</h2>
 <div class="row"><span><b>Som</b><small>Efeitos sonoros do jogo</small></span><button class="switch" role="switch" aria-checked="${!!save.snd}" data-act="snd" aria-label="Som"></button></div>
 <div><b>Cor do Bip</b><small class="sub">Ganhe estrelas para liberar novas cores</small><div class="skins">${Object.keys(SKINS).map(k=>{const open=skinOpen(k);
  return `<button class="skin${open?"":" lock"}" style="--sc:${SKINS[k]}" data-skin="${k}" ${open?"":"disabled"} aria-pressed="${save.skin==k}" aria-label="Cor ${SKIN_NAME[k]}${open?"":", liberada com "+SKIN_AT[k]+" estrelas"}" title="${SKIN_NAME[k]}${open?"":" · liberada com "+SKIN_AT[k]+" estrelas"}">${open?"":`<span>${ic("star")}${SKIN_AT[k]}</span>`}</button>`}).join("")}</div></div>
 <div class="row">`+(ask?`<span><b>Apagar todo o progresso?</b><small>As estrelas deste aparelho serão perdidas.</small></span><span style="flex-direction:row;gap:6px"><button class="btn danger" data-act="wipe">Sim, apagar</button><button class="btn" data-act="cfg">Cancelar</button></span>`
  :`<span><b>Progresso</b><small>${totalStars()} estrelas neste aparelho · nível ${rankOf(totalStars())[1]}${nextRank(totalStars())?` (faltam ${nextRank(totalStars())[0]-totalStars()} para o próximo)`:""}</small></span><button class="btn danger" data-act="wipeAsk">Apagar progresso</button>`)+`</div>`}
const ACTS={close:closeModals,mission:showMission,skip:skipLevel,next(){closeModals();loadLevel(lvl+1,{force:1})},map(){drawMap();openModal("mapModal")},cfg(){drawCfg();openModal("cfgModal")},
 snd(){save.snd=save.snd?0:1;Snd.on=!!save.snd;persist();drawSnd();if(!$("cfgModal").hidden)drawCfg();Snd.click()},all(){save.all=save.all?0:1;persist();drawCfg();drawTop()},
 wipeAsk(){drawCfg(true)},wipe(){save.stars={};save.skip={};save.seen={};save.all=0;save.draft=null;save.skin="amarelo";persist();document.documentElement.style.setProperty("--skin",SKINS.amarelo);$("brandFace").innerHTML=bip("happy");if(G)buildRobot();for(const k in drafts)delete drafts[k];for(const k in fails)delete fails[k];for(const k in quizMiss)delete quizMiss[k];closeModals();loadLevel(0,{force:1})}};
document.addEventListener("click",e=>{const t=e.target.closest("[data-act],[data-skin],[data-wear]");if(!t)return;
 if(t.dataset.skin){setSkin(t.dataset.skin);drawCfg()}
 else if(t.dataset.wear){setSkin(t.dataset.wear);t.outerHTML="<span class='worn'>"+ic("check")+"Bip trocou de cor!</span>";const f=$("winSheet").querySelector(".bip");if(f)f.outerHTML=bip("happy")}
 else ACTS[t.dataset.act]()});
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeModals()});
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("pointerdown",e=>{if(e.target===m)closeModals()}));

/* ---------- Botões ---------- */
$("lvToggle").onclick=$("starBtn").onclick=ACTS.map;$("cfgBtn").onclick=ACTS.cfg;$("menuBtn").onclick=goMenu;$("sndBtn").onclick=ACTS.snd;
$("prevLv").onclick=()=>loadLevel(lvl-1);$("nextLv").onclick=()=>loadLevel(lvl+1);$("tipBtn").onclick=showTip;
$("run").onclick=()=>{if(!running){stepping=false;run()}else{stopReq=true;if(stepRes)stepRes()}};
$("step").onclick=()=>{if(!running){stepping=true;run()}else if(stepRes)stepRes();else{stepping=true;setCtl()}};
$("reset").onclick=()=>{if(!running){varSt=null;resetBoard();showMission()}};
$("undo").onclick=undo;
$("clear").onclick=()=>{if(!editable())return;const L=LEVELS[lvl];if(!countBlocks(P)&&L.type!="fix")return;snap();if(L.type=="fix")P=PGP(L.pre);else P={m:[],A:L.lockFn?P.A:[],B:[]};Snd.del();changed()};
$("spdBtn").onclick=()=>{save.spd=(save.spd+1)%SPEEDS.length;persist();drawSpd();Snd.click()};

/* ---------- Início ---------- */
let booted=false;
function start(hot){if(booted)return;booted=true;document.querySelectorAll("[data-ic]").forEach(el=>el.insertAdjacentHTML("afterbegin",ic(el.dataset.ic)));
 loadSave();save.all=0;if(!SKINS[save.skin]||!skinOpen(save.skin))save.skin="amarelo";
 if(hot&&hot.drafts)for(const t in hot.drafts){const p=reviveProg(hot.drafts[t]);if(p)drafts[t]=p}   // página atualizada com o jogo aberto: mantém os programas
 Snd.on=!!save.snd;document.documentElement.style.setProperty("--skin",SKINS[save.skin]);$("brandFace").innerHTML=bip("happy");drawSnd();drawSpd();
 init3D();let i=LEVELS.findIndex(l=>l.t==save.lvl);if(i<0||!unlocked(i))i=Math.max(0,LEVELS.findIndex((l,k)=>!isDone(k)&&unlocked(k)));loadLevel(i,{force:1})}
(()=>{let hot=null;try{hot=window.claude&&window.claude.hot||null;if(hot&&hot.snapshot)hot.snapshot(()=>({drafts}))}catch(e){hot=null}
 if(hot&&hot.ready){try{hot.ready(start)}catch(e){}setTimeout(()=>start({}),1500)}else start(hot&&hot.data||{})})();
</script>
