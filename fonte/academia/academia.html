<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Academia do Bip</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Academia do Bip — trilha de matemática do Fundamental 2 com o robô Bip em 3D */
:root{
 --bg:#e8edf4;--panel:#fff;--ink:#172536;--muted:#586779;--line:#c3cedc;--soft:#f0f4f9;
 --go:#0e8f86;--turn:#6b4fd8;--loop:#d58200;--cond:#2f6fd6;--paint:#d93a7f;--run:#ee5f2b;--star:#f0ad00;--good:#1b9a52;--bad:#d23f45;
 --display:"Baloo 2",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1520;--panel:#172130;--ink:#e8eef6;--muted:#9aa9bb;--line:#2c3a4d;--soft:#111a27;--good:#38c172;--bad:#ff6b70;--star:#ffc93a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1520;--panel:#172130;--ink:#e8eef6;--muted:#9aa9bb;--line:#2c3a4d;--soft:#111a27;--good:#38c172;--bad:#ff6b70;--star:#ffc93a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--run);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
.hidden{display:none!important}

/* ---------- Mapa da trilha ---------- */
#home{max-width:920px;margin:0 auto;padding:18px 16px 40px}
.hero{display:flex;align-items:center;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 20px;margin-bottom:14px}
.hero .bipmini{width:86px;flex:none}
.hero h1{font-size:2rem}.hero h1 b{color:var(--run)}
.hero p{margin:4px 0 0;color:var(--muted)}
.hero .info{flex:1;min-width:0}
.lvl{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.coinrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.5rem;padding:4px 14px 4px 6px;border-radius:99px;background:color-mix(in srgb,#f2b20a 18%,var(--panel));border:1px solid color-mix(in srgb,#f2b20a 50%,var(--line));font-variant-numeric:tabular-nums}
.coinrow .coin{width:30px;height:30px}.coin{width:1.1em;height:1.1em;vertical-align:-.2em}
.lvl .n{font-family:var(--display);font-weight:800;font-size:1.1rem}
.lvl .xb{flex:1;min-width:120px;height:9px;background:var(--line);border-radius:9px;overflow:hidden}
.lvl .xb i{display:block;height:100%;background:linear-gradient(90deg,var(--turn),var(--run))}
.lvl small{color:var(--muted)}
.axs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.05em}
.axs span{width:34px;height:24px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line);font-family:Georgia,serif;font-size:.8rem;color:var(--muted)}
.axs span.on{background:linear-gradient(#ffe58a,var(--star));border-color:var(--star);color:#5a3a00}
.world{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px}
.world.lock{opacity:.7}
.wh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.wh .wn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:1.2rem;flex:none}
.wh h2{font-size:1.3rem}.wh p{margin:0;color:var(--muted);font-size:.9rem}
.wh .wc{margin-left:auto;font-weight:700;font-size:.85rem;color:var(--muted);white-space:nowrap}
.soon{display:flex;flex-wrap:wrap;gap:6px}
.soon span{padding:3px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.tagsoon{display:inline-block;margin-top:2px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.trail{display:flex;flex-direction:column;gap:8px}
.les{display:flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;width:100%}
.les .num{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;border:2px solid var(--line);color:var(--muted);background:var(--panel)}
.les .ico{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.1rem;background:var(--panel);border:1px solid var(--line)}
.les .tx{flex:1;min-width:0}
.les .tag{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.les h3{font-size:1.08rem;margin:1px 0}
.les p{margin:0;color:var(--muted);font-size:.86rem}
.les .go{flex:none;padding:7px 12px;border-radius:12px;font-weight:700;font-size:.88rem;border:1px solid var(--line);background:var(--panel);white-space:nowrap;text-align:center}
.les .go small{display:block;font-size:.7rem;opacity:.85}
.les.next{border:2px solid var(--run);background:var(--panel)}
.les.next .num,.les.next .go{background:var(--run);border-color:var(--run);color:#fff}
.les.done .num{background:var(--good);border-color:var(--good);color:#fff}
.les.done .tag{color:var(--good)}
.les.lock{opacity:.55;cursor:not-allowed}
.foot{margin-top:14px;color:var(--muted);font-size:.85rem;text-align:center}

/* ---------- Aula ---------- */
#lesson{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:10px 16px 12px;gap:10px;max-width:1400px;margin:0 auto}
.ltop{display:flex;align-items:center;gap:12px;flex:none}
.ltop .ln{font-family:var(--display);font-weight:800;color:var(--run);white-space:nowrap}
.ltop .lt{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw}
.bar{flex:1;height:8px;border-radius:9px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--turn),var(--run));border-radius:9px;transition:width .4s}
.ltop .pc{font-weight:700;font-size:.9rem;width:3.2em;text-align:right}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:9px 16px;font-weight:700}
.btn.sm{padding:6px 12px;border-radius:11px;font-size:.9rem}
.btn.main{background:var(--run);border-color:var(--run);color:#fff;box-shadow:0 4px 0 #b9441c;font-family:var(--display);font-size:1.1rem;padding:8px 22px}
.btn.main:active{transform:translateY(2px);box-shadow:0 2px 0 #b9441c}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.lbody{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:1fr auto auto;gap:10px}
#stage{position:relative;min-height:0;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
#cv,#cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:calc(100% - 28px);max-width:760px}
#ov>*{pointer-events:auto}
#act{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:calc(100% - 24px);max-width:820px}
#act:empty,#ov:empty{display:none}
.hintcam{position:absolute;right:12px;top:10px;font-size:.75rem;color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:3px 9px;border-radius:99px;pointer-events:none}
.sayrow{display:flex;align-items:flex-end;gap:12px}
.sayrow .face{width:74px;flex:none}
#say{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 18px;position:relative;min-height:64px}
#say:before{content:"";position:absolute;left:-9px;bottom:20px;width:16px;height:16px;background:var(--panel);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
#say .who{font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--run)}
#say .txt{font-size:1.12rem;margin-top:2px}
#say .txt b{color:var(--turn)}
#say.ok{border-color:var(--good)}#say.ok .who{color:var(--good)}
#say.no{border-color:var(--bad)}#say.no .who{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px}

.panel{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:0 8px 24px rgba(10,20,40,.12);text-align:center}
.q{font-family:var(--display);font-weight:800;font-size:clamp(1.15rem,2.6vw,1.6rem);line-height:1.15;margin-bottom:8px}
.opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opt{min-width:84px;padding:8px 16px;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-family:var(--display);font-weight:800;font-size:1.12rem;box-shadow:0 4px 0 var(--line)}
.opt:hover{border-color:var(--turn)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--panel));box-shadow:0 4px 0 var(--good)}
.opt.wrong{border-color:var(--bad);opacity:.6;box-shadow:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.blk{border:none;border-radius:12px;padding:8px 13px;color:#fff;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.blk.f{background:var(--go)}.blk.t{background:var(--turn)}.blk.rep{background:var(--loop)}
.prog{display:flex;gap:5px;flex-wrap:wrap;min-height:38px;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:12px;padding:5px 10px;margin-bottom:8px}
.prog span{border-radius:8px;padding:2px 9px;font-weight:700;color:#fff;font-size:.88rem}
.prog .ph{color:var(--muted);font-size:.88rem;font-weight:400}
.readout{font-family:var(--display);font-weight:800;font-size:1.5rem}
.stp{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.stp b{font-size:.85rem}.stp .sn{font-size:1.2rem;min-width:1.4em;text-align:center}
.unlock{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:12px;border-radius:18px;border:2px solid var(--star);background:color-mix(in srgb,var(--star) 14%,var(--panel));animation:pop .5s ease}
.unlock b{font-family:var(--display);font-size:1.2rem}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
input[type=range]{width:min(420px,70vw);accent-color:var(--run)}
.axcard{border:2px solid var(--star);background:color-mix(in srgb,var(--star) 14%,var(--panel));border-radius:18px;padding:12px 22px;text-align:center;box-shadow:0 10px 30px rgba(120,80,0,.18)}
.axcard .k{font-size:.72rem;font-weight:700;letter-spacing:.14em;color:var(--loop)}
.axcard h3{font-family:Georgia,serif;letter-spacing:.06em;font-size:1.4rem;margin:2px 0}
.axcard p{margin:0;font-size:1.05rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;width:100%}
.card{border:2px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center;background:var(--panel);font-family:var(--display);font-weight:800;font-size:1.15rem}
.card small{display:block;font-family:var(--body);font-weight:400;font-size:.82rem;color:var(--muted)}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--star);border-radius:22px;padding:16px 30px;background:color-mix(in srgb,var(--star) 12%,var(--panel));text-align:center;box-shadow:0 10px 30px rgba(120,80,0,.2)}
.badge .medal{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,var(--star) 60%,#b97c00);display:grid;place-items:center;font-size:1.8rem;color:#6b4400;font-family:var(--display);font-weight:800;box-shadow:0 5px 0 #a06c00}
.badge .xp{color:var(--loop);font-weight:700}
.load{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}

@media (max-width:760px){
 #lesson{padding:8px 10px 10px;gap:8px}
 .ltop .lt{display:none}
 .sayrow .face{width:52px}
 #say{padding:8px 12px}#say .txt{font-size:.98rem}
 .hero{flex-direction:column;text-align:center}.lvl,.axs{justify-content:center}
 .les .ico{display:none}
 .wh .wc{display:none}
 .opt{min-width:64px;font-size:1rem;padding:7px 12px}
 .hintcam{display:none}
 .q{font-size:1.05rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ======== MAPA ======== -->
<main id="home">
 <section class="hero">
  <div class="bipmini" id="heroBip"></div>
  <div class="info">
   <h1>Academia do <b>Bip</b></h1>
   <p>A matemática do Fundamental 2, do primeiro ponto até as funções. Ande, toque, gire e programe com o Bip.</p>
   <div class="lvl"><span class="coinrow" id="coinRow"></span><small id="coinTxt"></small></div>
   <div class="axs">AXIOMAS DE EUCLIDES <span data-ax="I">I</span><span data-ax="II">II</span><span data-ax="III">III</span><span data-ax="IV">IV</span><span data-ax="V">V</span></div>
  </div>
 </section>
 <div id="worlds"></div>
 <p class="foot">O progresso fica salvo neste aparelho.</p>
</main>

<!-- ======== AULA ======== -->
<section id="lesson" class="hidden">
 <div class="ltop">
  <span class="ln" id="lnum">AULA 01</span><span class="lt" id="ltit"></span>
  <div class="bar"><i id="lbar"></i></div><span class="pc" id="lpc">0%</span>
  <button class="btn sm" id="exit">Sair ✕</button>
 </div>
 <div class="lbody">
  <div id="stage"><div id="cv"></div><div class="load" id="load">Carregando o cenário 3D…</div><div class="hintcam">arraste para girar a câmera</div><div id="ov"></div><div id="act"></div></div>
  <div class="sayrow"><div class="face" id="face"></div><div id="say" aria-live="polite"><div class="who">BIP</div><div class="txt" id="txt"></div></div></div>
  <div class="nav"><button class="btn" id="back">← Voltar</button><button class="btn main" id="next">Prosseguir →</button></div>
 </div>
</section>

<script>
/* =====================================================================
   ACADEMIA DO BIP
   - Cada MUNDO tem AULAS; cada aula tem PASSOS.
   - Passo: m (cara do Bip), t (fala), set() monta a cena, play() anima,
     a (atividade: opt, pick, turn, slider, prog). O botão Prosseguir só
     libera quando a animação termina ou o aluno acerta a atividade.
   - Coordenadas das aulas são as do plano: (x, y), com y "para o fundo".
   ===================================================================== */
const $=id=>document.getElementById(id);
const M=n=>String(n).replace(/-/g,"−");
const D2R=Math.PI/180;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const dark=()=>document.documentElement.dataset.theme=="dark"||(document.documentElement.dataset.theme!="light"&&matchMedia("(prefers-color-scheme: dark)").matches);

/* ---------- Bip 2D (rosto ao lado da fala e no mapa) ---------- */
const FACE2D_BASE=m=>`<svg viewBox="0 0 200 170" style="width:100%;height:auto"><line x1="100" y1="34" x2="100" y2="12" stroke="#3b4250" stroke-width="6" stroke-linecap="round"/><circle cx="100" cy="10" r="9" fill="#ee5f2b"/>
<rect x="18" y="30" width="164" height="124" rx="32" fill="#f2c230" stroke="#b98d10" stroke-width="5"/><rect x="38" y="50" width="124" height="84" rx="20" fill="#172536"/>${FACES[m]||FACES.normal}</svg>`;
const FACES={
 normal:`<rect x="66" y="70" width="18" height="28" rx="9" fill="#5ef0e0"/><rect x="116" y="70" width="18" height="28" rx="9" fill="#5ef0e0"/><path d="M86 112q14 9 28 0" stroke="#5ef0e0" stroke-width="5" fill="none" stroke-linecap="round"/>`,
 feliz:`<path d="M62 92q12-17 24 0M114 92q12-17 24 0" stroke="#5ef0e0" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M80 108q20 17 40 0" stroke="#5ef0e0" stroke-width="6" fill="none" stroke-linecap="round"/>`,
 pensa:`<rect x="72" y="64" width="16" height="22" rx="8" fill="#5ef0e0"/><rect x="122" y="64" width="16" height="22" rx="8" fill="#5ef0e0"/><path d="M88 114h24" stroke="#5ef0e0" stroke-width="5" stroke-linecap="round"/>`,
 ops:`<path d="M64 74l18 18M82 74l-18 18M118 74l18 18M136 74l-18 18" stroke="#ff8a8a" stroke-width="6" stroke-linecap="round"/><circle cx="100" cy="114" r="7" fill="none" stroke="#ff8a8a" stroke-width="5"/>`};
FACES.festa=FACES.feliz;FACES.aponta=FACES.normal;

/* =====================================================================
   MOTOR 3D
   ===================================================================== */
let R,scene,cam,root,fx,floorMat,bigGrid,smallGrid,bip,ok3d=false;
const camS={th:Math.PI/2-.35,ph:.95,r:13.5,tx:0,tz:0},camGoal={...camS};
const P3=(x,y,h=0)=>new THREE.Vector3(x,h,-y);
const mat=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.05,...o});
let runId=0;

function tween(ms,fn){const id=runId;return new Promise(res=>{const t0=performance.now();const f=now=>{if(id!=runId)return res(false);const k=Math.min(1,(now-t0)/ms);fn(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,k);if(k<1)requestAnimationFrame(f);else res(true)};requestAnimationFrame(f)})}
const wait=ms=>{const id=runId;return new Promise(r=>setTimeout(()=>r(id==runId),ms))};

function init3d(){if(ok3d)return true;if(!window.THREE){$("load").textContent="Não foi possível carregar o 3D. Verifique a internet e recarregue a página.";return false}
 R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
 $("cv").appendChild(R.domElement);
 scene=new THREE.Scene();cam=new THREE.PerspectiveCamera(42,1,.1,300);
 scene.add(new THREE.HemisphereLight(0xffffff,0x8b9bb0,.85));
 const rim=new THREE.DirectionalLight(0xa8c8ff,.45);rim.position.set(-8,9,-12);scene.add(rim);
 const sun=new THREE.DirectionalLight(0xfff4e0,.8);sun.position.set(6,14,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10});scene.add(sun);
 floorMat=mat(0xf6f8fb,{roughness:.9});const fl=new THREE.Mesh(new THREE.PlaneGeometry(400,400),floorMat);fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;scene.add(fl);
 bigGrid=new THREE.GridHelper(120,120,0xd5dde8,0xe2e8f0);bigGrid.position.y=.002;scene.add(bigGrid);
 smallGrid=new THREE.GridHelper(12,12,0x9fb0c6,0xb9c6d6);smallGrid.position.y=.004;scene.add(smallGrid);
 const edge=new THREE.Mesh(new THREE.RingGeometry(0,0,4),mat(0));edge.visible=false;
 root=new THREE.Group();scene.add(root);fx=new THREE.Group();scene.add(fx);
 bip=makeBip();scene.add(bip.g);
 theme3d();matchMedia("(prefers-color-scheme: dark)").addEventListener("change",theme3d);
 new ResizeObserver(size).observe($("stage"));size();
 setupPointer();
 let last=performance.now();const loop=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;
  for(const k in camGoal)camS[k]+=(camGoal[k]-camS[k])*Math.min(1,dt*4);
  const {th,ph,r,tx,tz}=camS;cam.position.set(tx+r*Math.sin(ph)*Math.cos(th),r*Math.cos(ph),tz+r*Math.sin(ph)*Math.sin(th));cam.lookAt(tx,0,tz);
  bip.tick(dt,now/1000);root.children.forEach(o=>o.userData.tick&&o.userData.tick(now/1000));
  for(let i=fx.children.length-1;i>=0;i--){const o=fx.children[i];if(o.userData.step&&o.userData.step(dt)===false){fx.remove(o);o.geometry&&o.geometry.dispose();o.material&&o.material.dispose()}}
  R.render(scene,cam);requestAnimationFrame(loop)};
 requestAnimationFrame(loop);ok3d=true;$("load").remove();return true}
function theme3d(){const d=dark(),bg=d?0x0e1520:0xe8edf4;scene.background=new THREE.Color(bg);scene.fog=new THREE.Fog(bg,18,40);
 floorMat.color.setHex(d?0x162131:0xf6f8fb);
 [bigGrid,smallGrid].forEach((g,i)=>{const c=d?(i?0x3a4b63:0x223047):(i?0x9fb0c6:0xdbe2ec);[].concat(g.material).forEach(m=>{m.vertexColors=false;m.color.setHex(c);m.needsUpdate=true})})}

function makeBip(){const P=BIPV.buildBody(),{g,inner,body,legs,arms,scr,bulb,glow,halo,s}=P;BIPV.dress(P,myLook());
 const B={g,x:0,y:0,h:0,a:90,walking:0,wv:0,ph:0,mood:"feliz",fix:0,last:0,blinkAt:2,squash:0,
  place(x,y,a){B.x=x;B.y=y;if(a!=null)B.a=a;B.last=performance.now();B.sync()},
  sync(){g.position.copy(P3(B.x,B.y,B.h));g.rotation.y=(B.a+90)*D2R},
  face(m){if(m==B.mood)return;B.mood=m;BIPV.setMood(P,m);if(m=="festa")B.squash=1},
  tick(dt,t){if(!B.walking&&!B.fix&&performance.now()-B.last>900){const ca=Math.atan2(-cam.position.z-B.y,cam.position.x-B.x)/D2R,d=((ca-B.a)%360+540)%360-180;if(Math.abs(d)>1){B.a+=d*Math.min(1,dt*3);B.sync()}}
   /* andar: a força do passo (wv) sobe e desce aos poucos, sem trancos */
   B.wv+=(B.walking-B.wv)*Math.min(1,dt*7);const w=B.wv;B.ph+=dt*10.5*Math.max(w,.0001);
   const sw=Math.sin(B.ph)*.7*w;legs[0].rotation.x=sw;legs[1].rotation.x=-sw;
   let la=-sw*.9,ra=sw*.9,lz=.12,rz=-.12,jump=0,tilt=Math.sin(t*1.3)*.035,nod=0;
   const ease=(cur,goal)=>cur+(goal-cur)*Math.min(1,dt*9);
   if(w<.3){if(B.mood=="aponta"){rz=2.4;ra=-.3+Math.sin(t*3)*.08;tilt=-.08}
    else if(B.mood=="festa"){const j=Math.abs(Math.sin(t*6));lz=-2.6+Math.sin(t*12)*.25;rz=2.6-Math.sin(t*12)*.25;jump=j*.38;nod=-.08}
    else if(B.mood=="pensa"){ra=-1.9;rz=.55;tilt=.14+Math.sin(t*1.6)*.03}
    else if(B.mood=="ops"){lz=-.6;rz=.6;tilt=Math.sin(t*9)*.06}
    else {la=Math.sin(t*1.8)*.06;ra=-Math.sin(t*1.8)*.06}}
   B.arm=B.arm||[0,0,0,0];B.arm=[ease(B.arm[0],la),ease(B.arm[1],lz),ease(B.arm[2],ra),ease(B.arm[3],rz)];
   arms[0].rotation.set(B.arm[0],0,B.arm[1]);arms[1].rotation.set(B.arm[2],0,B.arm[3]);
   B.tl=ease(B.tl||0,tilt);B.nd=ease(B.nd||0,nod+w*.13);body.rotation.z=B.tl;inner.rotation.x=B.nd;
   B.squash=Math.max(0,B.squash-dt*3.5);const sq=Math.sin(B.squash*Math.PI)*.12;
   inner.scale.set(s*(1+sq*.6),s*(1-sq),s*(1+sq*.6));
   body.position.y=Math.sin(t*2.4)*.035+Math.abs(Math.sin(B.ph))*.07*w;inner.position.y=jump;
   const pulse=.5+.5*Math.sin(t*4);glow.intensity=.35+.5*pulse;halo.material.opacity=.45+.4*pulse;
   /* piscar */
   if(t>B.blinkAt){B.blinkAt=t+2.5+Math.random()*3;if(/normal|aponta|pensa/.test(B.mood)){scr.material.map=BIPV.faceTex("pisca",P.look);setTimeout(()=>{scr.material.map=BIPV.faceTex(B.mood,P.look)},130)}}
   BIPV.tick(P,t,dt)},
  async turnTo(a){let d=((a-B.a)%360+540)%360-180;if(Math.abs(d)<.5){B.a=a;return true}const a0=B.a;return await tween(Math.abs(d)*4+120,k=>{B.a=a0+d*k;B.last=performance.now();B.sync()})},
  async turn(d){const a0=B.a;return await tween(Math.abs(d)*5+150,k=>{B.a=a0+d*k;B.last=performance.now();B.sync()})},
  async walk(pts,o={}){for(const [x,y] of pts){const dx=x-B.x,dy=y-B.y,L=Math.hypot(dx,dy);if(L<1e-6)continue;
    if(!o.noTurn&&!(await B.turnTo(Math.atan2(dy,dx)/D2R)))return false;
    const x0=B.x,y0=B.y;let tr=null;if(o.trail)tr=seg([x0,y0],[x0,y0],{color:o.trail,w:o.w||.07});
    B.walking=1;const okk=await tween(L*(o.ms||420),(k,lin)=>{const q=lin-Math.sin(2*Math.PI*lin)/(2*Math.PI)*.4;  /* começa e termina mais devagar */
      B.x=x0+dx*q;B.y=y0+dy*q;B.sync();if(tr)tr.set([x0,y0],[B.x,B.y]);o.each&&o.each(B.x,B.y)});B.walking=0;B.last=performance.now();if(!okk)return false}
   B.squash=.5;return true},
  /* pulo (usado na reta numérica): sobe e desce, com uma agachadinha ao aterrissar */
  async hop(x,y,o={}){const dx=x-B.x,dy=y-B.y,L=Math.hypot(dx,dy);if(L<1e-6)return true;
   if(!o.noTurn&&!(await B.turnTo(Math.atan2(dy,dx)/D2R)))return false;
   const x0=B.x,y0=B.y,H=o.h??Math.min(2.2,.6+L*.28);B.squash=.6;if(!(await wait(90)))return false;
   const ok=await tween(o.ms||Math.max(380,L*170),(k,lin)=>{B.x=x0+dx*lin;B.y=y0+dy*lin;B.h=4*H*lin*(1-lin);B.sync()});B.h=0;B.sync();B.squash=1;B.last=performance.now();return ok}};
 B.sync();return B}

 {m:"pensa",t:"E por <b>um ponto só</b>? Olhe: passam <b>infinitas</b> retas! Por isso um ponto sozinho não basta para escolher uma reta.",set(){pt("P",0,0);B().place(-3,-3,45)},
  async play(){for(let a=0;a<180;a+=30){const r=reta([0,0],[Math.cos(a*D2R),Math.sin(a*D2R)],{op:.85});if(!(await wait(350)))return}}},
 {m:"aponta",t:"Pontos que estão na <b>mesma reta</b> se chamam <b>colineares</b>. A, B e C são colineares. D não é: está fora da reta.",set(){reta([-4,-2],[4,2]);pt("A",-4,-2);pt("B",0,0);pt("C",2,1);pt("D",-1,3,{color:COL.poly});B().place(3,-3,135)}},
 {m:"normal",t:"Hora do desafio.",a:{k:"opt",q:"Quantas retas passam por dois pontos diferentes?",o:["Nenhuma","Exatamente uma","Infinitas"],ans:1,ok:"Exato! Esse é o <b>Axioma I</b>.",no:"Lembre do teste que você fez: apareceu uma reta só."},set(){pt("A",-2,0);pt("B",2,0);B().place(0,-3,90)}},
 {m:"festa",end:1,t:"Você conquistou o <b>Axioma I</b> de Euclides! Ele é a base de tudo o que vem depois.",set(){B().place(0,0,-90)},badge:["I","Axioma I","Por dois pontos passa uma única reta."]}]},

/* 3 */{t:"Segmento e semirreta",d:"Axioma II: pedaços de reta e o prolongamento sem fim.",i:"—",ax:"II",steps:[
 {m:"aponta",t:"Quando ando de A até B e paro, desenho só um pedaço da reta: um <b>segmento</b>. Ele tem começo e fim. Escrevemos <b>AB</b> com um tracinho em cima.",set(){pt("A",-3,0);pt("B",2,0);B().place(-3,0,0)},async play(){await B().walk([[2,0]],{trail:COL.seg})}},

 {m:"pensa",t:"Euclides também disse que <b>todo segmento pode ser prolongado</b> em linha reta, sem fim. Veja o segmento CD crescer!",set(){B().place(-1,-3,90);ov(AX("II","Todo segmento pode ser <b>prolongado</b> continuamente em linha reta."))},
  async play(){pt("C",-1,1);pt("D",1,1);const s=seg([-1,1],[1,1],{color:COL.seg});await wait(600);await tween(2000,k=>s.set([-1-40*k,1],[1+40*k,1]))}},
 {m:"normal",t:"Que figura é esta?",set(){pt("O",-2,0);semi([-2,0],[0,1]);B().place(-3,-3,60)},a:{k:"opt",q:"Começa em O e não tem fim. Que figura é?",o:["Reta","Segmento","Semirreta"],ans:2,ok:"Isso: <b>semirreta</b>. Tem origem, mas não tem fim.",no:"Ela tem começo (o ponto O), mas não tem fim."}},
 {m:"normal",t:"E esta?",set(){pt("E",-3,1);pt("F",2,-1);seg([-3,1],[2,-1]);B().place(0,-3,90)},a:{k:"opt",q:"Começa em E e termina em F. Que figura é?",o:["Reta","Segmento","Semirreta"],ans:1,ok:"Certo: o <b>segmento EF</b>. Tem começo e fim.",no:"Ela tem começo E e fim F."}},
 {m:"normal",t:"Toque no ponto onde esta semirreta <b>começa</b> (a origem).",set(){semi([1,-2],[-1,2]);B().place(3,-3,135)},a:{k:"pick",n:1,mark:0,check:async p=>{if(p[0][0]==1&&p[0][1]==-2){await B().walk([[1,-2]]);return {ok:1,msg:"Isso! A origem é onde a semirreta começa."}}return {ok:0,msg:"Ali não. Procure a ponta que <b>não</b> continua para sempre."}}}},
 {m:"festa",end:1,t:"Agora você conhece reta, segmento e semirreta, e conquistou o <b>Axioma II</b>!",set(){B().place(0,0,-90)},badge:["II","Axioma II","Todo segmento pode ser prolongado."]}]},

/* 4 */{t:"O plano",d:"A superfície sem fim e as dimensões.",i:"▱",steps:[

 {m:"pensa",t:"Um plano também pode ficar inclinado. <b>Três pontos que não estão na mesma reta</b> definem um único plano. Veja: um dos pontos está no alto de uma haste.",set(){camTo({ph:.95,r:16,th:Math.PI/2-.5});pt("A",-3,-2);pt("B",3,-2);post(0,2,2.5);label("C",0,2,3.1,{size:.5});plane3([-3,0,2],[3,0,2],[0,2.5,-2]);B().place(-4,-4,45)}},
 {m:"normal",t:"Toque em <b>3 pontos que NÃO estejam na mesma reta</b>. Eles vão formar um pedaço do plano.",set(){camTo({ph:.92,r:15,th:Math.PI/2-.35});B().place(-5,-5,45)},
  a:{k:"pick",n:3,names:["A","B","C"],check:async p=>{const [a,b,c]=p,cr=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
   if(cr==0)return {ok:0,retry:1,msg:"Esses três estão na <b>mesma reta</b> (são colineares). Com eles dá para fazer infinitos planos girando em volta da reta. Tente outros!"};
   poly(p,{color:COL.reta,op:.3});await B().walk([a,b,c,a],{trail:COL.reta});return {ok:1,msg:"Isso! Três pontos <b>não colineares</b> determinam um único plano."}}}},
 {m:"normal",t:"Pense no seu dia a dia.",a:{k:"opt",q:"Uma folha de papel bem esticada lembra:",o:["um ponto","uma reta","um plano"],ans:2,ok:"Certo! Uma superfície lisa lembra um <b>plano</b>.",no:"A folha é uma superfície, não uma linha."},set(){B().place(0,0,-90)}},
 {m:"aponta",t:"Repare: o ponto não tem nenhuma dimensão. A reta tem uma. O plano tem duas. E o espaço onde vivemos tem três!",set(){B().place(-4,-3,45);pt("",-3,2);seg([-1,2],[1,2],{color:COL.reta});poly([[2,1],[4,1],[4,3],[2,3]],{color:COL.reta});
  const cube=new THREE.Mesh(new THREE.BoxGeometry(1.4,1.4,1.4),mat(COL.poly,{transparent:true,opacity:.55}));cube.position.copy(P3(4.5,-1.5,.7));cube.castShadow=true;add(cube);
  ov(CARDS([["Ponto","0 dimensões"],["Reta","1 dimensão"],["Plano","2 dimensões"],["Espaço","3 dimensões"]]))}},
 {m:"festa",end:1,t:"Ponto, reta, plano e espaço: você já conhece os blocos básicos da geometria!",set(){B().place(0,0,-90)},badge:["▱","O plano","Superfície sem fim, duas dimensões."]}]},

/* 5 */{t:"Medindo distâncias",d:"Unidade de medida, comprimento e conversões.",i:"📏",steps:[

 {m:"aponta",t:"No dia a dia usamos unidades combinadas por todo mundo: o <b>metro</b> e seus parentes.",set(){B().place(0,-2,90);ov(CARDS([["1 km","= 1000 m"],["1 m","= 100 cm"],["1 cm","= 10 mm"]]))}},

  a:{k:"pick",n:1,names:["B"],check:async p=>{const [x,y]=p[0];if(y==0&&Math.abs(x)==3){await B().walk([[0,0],[x,0]],{trail:COL.seg});return {ok:1,msg:"Perfeito! <b>AB = 3 unidades</b>."}}return {ok:0,msg:`Esse ponto não está a 3 unidades de A na horizontal. Conte 3 quadradinhos para a direita ou para a esquerda.`}}}},

/* 6 */{t:"O giro do Bip",d:"Ângulos: volta, meia-volta e ângulo reto (Axioma IV).",i:"∠",ax:"IV",steps:[

 {m:"pensa",t:"Euclides percebeu algo importante: um ângulo reto é sempre igual a outro ângulo reto, não importa a posição.",set(){B().place(0,-3,90);[[-3,1,0],[2,0,35]].forEach(([x,y,a])=>{semi([x,y],[x+Math.cos(a*D2R),y+Math.sin(a*D2R)],{w:.04});semi([x,y],[x+Math.cos((a+90)*D2R),y+Math.sin((a+90)*D2R)],{w:.04});rightMark([x,y],a,.6)});ov(AX("IV","Todos os ângulos retos são <b>iguais</b> entre si."))}},

 {m:"pensa",t:"Agora um segredo de todo triângulo: some os três ângulos internos…",set(){triFig();B().place(-5,-3,45)}},

  a:{k:"prog",blocks:[["Andar 3","f",3],["Girar 90°","t",90],["Girar 120°","t",120],["Girar 60°","t",60]],check:(v,turns)=>v.closed&&v.n==3&&turns.every(t=>t==120),ok:"Perfeito! Girei 120° em cada canto (180° − 60°): <b>triângulo equilátero</b>.",no:"Não fechou um triângulo. Pense: 180° − 60° = ?"}},

const NCOL={u:0xf2c230,d:0x0e8f86,c:0x6b4fd8,red:0xd23f45,good:0x1b9a52,grey:0x9aa9bb};

  async play(){const X=nline(0,12);B().place(X(0),0,0);if(!(await wait(400)))return;arcLine(X(0),X(3),0xee5f2b,1.2);if(!(await hopTo(X,3)))return;label("+3",X(1.5),0,2,{size:.5,color:"#ee5f2b"});
   arcLine(X(3),X(7),0x0e8f86,1.5);if(!(await hopTo(X,7)))return;label("+4",X(5),0,2.2,{size:.5,color:"#0e8f86"});label("3 + 4 = 7",X(7),2,.3,{size:.6})}},
 {m:"normal",t:"Estou no <b>5</b>. Toque na reta onde eu paro em <b>5 + 6</b>.",set(){const X=nline(0,12);B().place(X(5),0,0)},
  a:{k:"pick",n:1,mark:0,check:async p=>{const [x,y]=p[0],n=x+6;if(y==0&&n==11){await bip.hop(x,0);return {ok:1,msg:"Isso! 6 pulinhos para a direita: <b>5 + 6 = 11</b>."}}return {ok:0,msg:"Ali não. Comece no 5 e conte 6 casas para a <b>direita</b>."}}}},
 {m:"aponta",t:"Subtrair é pular para a <b>esquerda</b>. 9 − 4: saio do 9 e volto 4 casas.",set(){},
  async play(){const X=nline(0,12);B().place(X(9),0,180);if(!(await wait(400)))return;arcLine(X(9),X(5),0x6b4fd8,1.4);if(!(await hopTo(X,5)))return;label("−4",X(7),0,2,{size:.5,color:"#6b4fd8"});label("9 − 4 = 5",X(5),2,.3,{size:.6})}},
 {m:"normal",t:"Estou no <b>12</b>. Toque onde eu paro em <b>12 − 7</b>.",set(){const X=nline(0,12);B().place(X(12),0,180)},
  a:{k:"pick",n:1,mark:0,check:async p=>{const [x,y]=p[0],n=x+6;if(y==0&&n==5){await bip.hop(x,0);return {ok:1,msg:"Certo: <b>12 − 7 = 5</b>."}}return {ok:0,msg:"Comece no 12 e volte 7 casas para a <b>esquerda</b>."}}}},
 {m:"pensa",t:"Somar e subtrair são <b>operações inversas</b>: uma desfaz a outra. Vou ao 11 com +6 e volto ao 5 com −6.",set(){},
  async play(){const X=nline(0,12);B().place(X(5),0,0);if(!(await wait(300)))return;arcLine(X(5),X(11),0xee5f2b,1.6);if(!(await hopTo(X,11)))return;if(!(await wait(300)))return;
   arcLine(X(11),X(5),0x6b4fd8,.8);if(!(await hopTo(X,5)))return;label("5 + 6 = 11  ⇄  11 − 6 = 5",0,2.2,.3,{size:.55})}},
 {m:"normal",t:"Use a ideia de inversa.",set(){B().place(0,-3,90)},a:{k:"opt",q:"Se 38 + 25 = 63, quanto é 63 − 25?",o:["38","25","88"],ans:0,ok:"Isso! A subtração desfaz a soma: <b>38</b>.",no:"Se somar 25 levou de 38 a 63, tirar 25 volta para onde?"}},
 {m:"normal",t:"Agora uma conta maior. Some as unidades, depois as dezenas, depois as centenas.",set(){B().place(0,-3,90);ov(CARDS([["7 + 5","= 12 unidades"],["4 + 3 + 1","= 8 dezenas"],["2 + 1","= 3 centenas"]]))},
  a:{k:"opt",q:"Quanto é 247 + 135?",o:["372","382","482"],ans:1,ok:"Certo! 12 unidades viram 1 dezena e 2 unidades (o famoso <b>vai um</b>): <b>382</b>.",no:"7 + 5 = 12: escreva 2 e leve 1 dezena para a próxima coluna."}},
 {m:"festa",end:1,t:"Somar e subtrair agora são pulos na reta para você!",set(){B().place(0,0,-90)},badge:["+","Saltador","Adição e subtração."]}]},

/* 4 */{t:"Multiplicação",d:"Somas repetidas e retângulos de cubos.",i:"×",steps:[
 {m:"aponta",t:"Multiplicar é <b>somar parcelas iguais</b>. 3 × 4 é somar o 4 três vezes: 4 + 4 + 4.",set(){camTo({th:Math.PI/2-.2,ph:.9,r:13,tx:0,tz:0})},
  async play(){const X=nline(0,12);B().place(X(0),0,0);for(let i=0;i<3;i++){if(!(await wait(250)))return;arcLine(X(4*i),X(4*i+4),[0xee5f2b,0x0e8f86,0x6b4fd8][i],1.5);if(!(await hopTo(X,4*i+4)))return;label("+4",X(4*i+2),0,2.2,{size:.45})}
   label("3 × 4 = 12",X(12)-1,2,.3,{size:.6})}},
 {m:"aponta",t:"Também dá para ver como um <b>retângulo</b>: 3 fileiras com 4 cubos cada. Total: 12 cubos.",set(){B().place(-5,-3,30)},
  async play(){for(let r=0;r<3;r++){for(let c=0;c<4;c++){const m=cube(-1.5+c*.9,1.4-r*.9,NCOL.u,{s:.6});m.position.y+=1.2;if(!(await tween(120,k=>{m.position.y=.3+1.2*(1-k)})))return}label(`${(r+1)*4}`,2.4,1.4-r*.9,.4,{size:.45})}}},
 {m:"pensa",t:"Agora giro o retângulo: viram 4 fileiras de 3. Continua 12! Na multiplicação, <b>a ordem não muda o resultado</b>: 3 × 4 = 4 × 3.",set(){B().place(-5,-3,30)},
  async play(){const G=new THREE.Group();add(G);for(let r=0;r<3;r++)for(let c=0;c<4;c++){const m=new THREE.Mesh(new THREE.BoxGeometry(.6,.6,.6),mat(NCOL.u,{roughness:.35,emissive:NCOL.u,emissiveIntensity:.1}));m.position.set(-1.35+c*.9,.3,-.9+r*.9);m.castShadow=true;G.add(m)}
   if(!(await wait(500)))return;if(!(await tween(1100,k=>{G.rotation.y=k*Math.PI/2})))return;label("4 × 3 = 12",0,-2.6,.3,{size:.6})}},
 {m:"normal",t:"Monte um retângulo com exatamente <b>24 cubos</b>. Escolha quantas fileiras e quantos cubos em cada uma.",set(){B().place(-5.5,-3.5,30)},
  a:{k:"step",c:[["Fileiras",1,8],["Cubos por fileira",1,8]],init:[2,2],goal:[3,8],draw:v=>{const s=.45;for(let r=0;r<v[0];r++)for(let c=0;c<v[1];c++)cube(-(v[1]-1)*s/2*1.15+c*s*1.15,1.6-r*s*1.15,NCOL.u,{s})},
   txt:v=>`${v[0]} × ${v[1]} = ${v[0]*v[1]}`,test:v=>v[0]*v[1]==24,ok:v=>`Isso! <b>${v[0]} × ${v[1]} = 24</b>. Existem outros jeitos também: 3 × 8, 4 × 6, 6 × 4, 8 × 3...`}},
 {m:"normal",t:"Tabuada!",set(){B().place(0,-3,90)},a:{k:"opt",q:"Quanto é 7 × 8?",o:["54","56","64"],ans:1,ok:"Certo: <b>56</b>. Dica: 7 × 8 = 7 × 4 × 2 = 28 × 2.",no:"Tente 7 × 4 = 28 e depois dobre."}},
 {m:"normal",t:"Na escola.",set(){B().place(-5,-3,30);for(let r=0;r<6;r++)for(let c=0;c<5;c++){const m=new THREE.Mesh(new THREE.BoxGeometry(.6,.4,.45),mat(0x8a6a4a));m.position.copy(P3(-2+c,2.5-r*.9,.2));m.castShadow=true;add(m)}},
  a:{k:"opt",q:"Uma sala tem 6 fileiras com 5 carteiras em cada. Quantas carteiras há?",o:["11","30","35"],ans:1,ok:"Isso: 6 × 5 = <b>30</b> carteiras.",no:"São 6 fileiras iguais de 5: multiplique."}},
 {m:"festa",end:1,t:"Você enxerga a multiplicação como soma repetida e como retângulo!",set(){B().place(0,0,-90)},badge:["×","Multiplicador","Somas iguais e retângulos."]}]},

/* 5 */{t:"Divisão",d:"Repartir em partes iguais, e o que sobra.",i:"÷",steps:[
 {m:"pensa",t:"Dividir é <b>repartir em partes iguais</b>. Tenho 12 cubos para dividir entre 3 amigos. Vou dar um para cada, na vez de cada um...",set(){B().place(-5,-3,30);[-3,0,3].forEach((x,i)=>{circ([x,2],.9,{fill:1,color:[0xee5f2b,0x0e8f86,0x6b4fd8][i]})})},
  async play(){const C=[];for(let i=0;i<12;i++)C.push(cube(-1.1+(i%4)*.5,-1.6-Math.floor(i/4)*.5,NCOL.u));if(!(await wait(500)))return;
   for(let i=0;i<12;i++){const a=i%3,q=Math.floor(i/3);if(!(await slide(C[i],[-3,0,3][a]-.3+(q%2)*.6,2.3-Math.floor(q/2)*.6,260,.9)))return}label("12 ÷ 3 = 4",0,-1.4,.3,{size:.6})}},
 {m:"aponta",t:"Dividir também responde: <b>quantos grupos de 3 cabem em 12?</b> Na reta, volto de 3 em 3 do 12 até o 0: são <b>4 pulos</b>.",set(){camTo({th:Math.PI/2-.2,ph:.9,r:13,tx:0,tz:0})},
  async play(){const X=nline(0,12);B().place(X(12),0,180);for(let i=0;i<4;i++){if(!(await wait(200)))return;arcLine(X(12-3*i),X(9-3*i),0x6b4fd8,1.2);if(!(await hopTo(X,9-3*i)))return;label(String(i+1)+"º",X(10.5-3*i),0,1.9,{size:.42})}}},
 {m:"aponta",t:"Às vezes <b>sobra</b>. 14 cubos para 3 amigos: cada um ganha 4 e sobram 2. A sobra se chama <b>resto</b>.",set(){B().place(-5,-3,30);[-3,0,3].forEach((x,i)=>circ([x,2],.9,{fill:1,color:[0xee5f2b,0x0e8f86,0x6b4fd8][i]}))},
  async play(){const C=[];for(let i=0;i<14;i++)C.push(cube(-1.4+(i%5)*.5,-1.4-Math.floor(i/5)*.5,i>=12?NCOL.red:NCOL.u));if(!(await wait(400)))return;
   for(let i=0;i<12;i++){const a=i%3,q=Math.floor(i/3);if(!(await slide(C[i],[-3,0,3][a]-.3+(q%2)*.6,2.3-Math.floor(q/2)*.6,200,.9)))return}
   label("← sobram 2",1.6,-2.4,.4,{size:.5,color:"#d23f45"});label("14 ÷ 3 = 4, resto 2",0,-3.6,.3,{size:.55})}},
 {m:"normal",t:"Tente.",set(){B().place(0,-3,90)},a:{k:"opt",q:"Quanto é 35 ÷ 5?",o:["6","7","8"],ans:1,ok:"Certo: <b>7</b>, porque 7 × 5 = 35.",no:"Pense: qual número vezes 5 dá 35?"}},
 {m:"normal",t:"Agora com resto.",set(){B().place(0,-3,90)},a:{k:"opt",q:"17 balas divididas entre 4 crianças. Quantas balas sobram?",o:["0","1","3"],ans:1,ok:"Isso! Cada uma ganha 4 (4 × 4 = 16) e <b>sobra 1</b>.",no:"Quanto é 4 × 4? E quanto falta para 17?"}},
 {m:"pensa",t:"A divisão é a <b>inversa da multiplicação</b>.",set(){B().place(0,-3,90);ov(CARDS([["4 × 3 = 12","multiplicação"],["12 ÷ 3 = 4","divisão"],["12 ÷ 4 = 3","divisão"]]))},
  a:{k:"opt",q:"Se 9 × 6 = 54, quanto é 54 ÷ 9?",o:["5","6","9"],ans:1,ok:"Certo: <b>6</b>. A divisão desfaz a multiplicação.",no:"9 vezes quanto dá 54?"}},
 {m:"festa",end:1,t:"Você sabe repartir, contar grupos e achar o resto!",set(){B().place(0,0,-90)},badge:["÷","Repartidor","Divisão exata e com resto."]}]},

/* 6 */{t:"Expressões numéricas",d:"Qual conta vem primeiro? A ordem das operações.",i:"( )",steps:[
 {m:"pensa",t:"Quanto é <b>2 + 3 × 4</b>? Se eu fizer na ordem em que leio, dá 20. Mas a resposta certa é <b>14</b>! Por quê?",set(){B().place(-5,-1.5,0);exprRow(["2","+","3","×","4"])}},
 {m:"aponta",t:"Existe uma <b>ordem combinada</b> no mundo inteiro: 1º parênteses, 2º multiplicação e divisão, 3º adição e subtração. Veja a multiplicação ser feita primeiro.",set(){B().place(-5,-1.5,0);ov(CARDS([["1º","( ) parênteses"],["2º","× e ÷"],["3º","+ e −"]]))},
  async play(){let r=exprRow(["2","+","3","×","4"]);if(!(await wait(800)))return;if(!(r=await merge(r,2,4,"12")))return;if(!(await wait(500)))return;if(!(r=await merge(r,0,2,"14")))return;confetti(0,1.5,24)}},
 {m:"aponta",t:"Os <b>parênteses</b> mandam fazer primeiro: (2 + 3) × 4 = 5 × 4 = <b>20</b>.",set(){B().place(-5,-1.5,0)},
  async play(){let r=exprRow(["(","2","+","3",")","×","4"]);if(!(await wait(800)))return;if(!(r=await merge(r,0,4,"5")))return;if(!(await wait(500)))return;if(!(r=await merge(r,0,2,"20")))return}},
 {m:"normal",t:"Primeiro a multiplicação!",set(){B().place(-5,-1.5,0);exprRow(["10","−","2","×","3"])},a:{k:"opt",q:"Quanto é 10 − 2 × 3?",o:["24","4","7"],ans:1,ok:"Isso! 2 × 3 = 6, depois 10 − 6 = <b>4</b>.",no:"Faça primeiro 2 × 3."}},
 {m:"normal",t:"Agora com parênteses.",set(){B().place(-5,-1.5,0);exprRow(["(","8","+","4",")","÷","2"])},a:{k:"opt",q:"Quanto é (8 + 4) ÷ 2?",o:["10","6","12"],ans:1,ok:"Certo: 12 ÷ 2 = <b>6</b>.",no:"Primeiro o que está dentro dos parênteses."}},
 {m:"normal",t:"Desafio da ordem.",set(){B().place(-5,-1.5,0);exprRow(["5","+","20","÷","5","−","1"])},a:{k:"opt",q:"Quanto é 5 + 20 ÷ 5 − 1?",o:["4","8","3"],ans:1,ok:"Perfeito: 20 ÷ 5 = 4, depois 5 + 4 − 1 = <b>8</b>.",no:"Faça a divisão primeiro. Depois some e subtraia da esquerda para a direita."}},
 {m:"festa",end:1,t:"Agora nenhuma expressão engana você!",set(){B().place(0,0,-90)},badge:["( )","Organizador","A ordem das operações."]}]},

/* 7 */{t:"Múltiplos e divisores",d:"Pular de tantos em tantos e dividir sem sobrar.",i:"3·4",steps:[
 {m:"aponta",t:"Os <b>múltiplos de 3</b> são os números onde eu paro pulando de 3 em 3 a partir do zero: 0, 3, 6, 9, 12...",set(){camTo({th:Math.PI/2-.2,ph:.9,r:13,tx:0,tz:0})},
  async play(){const X=nline(0,12);B().place(X(0),0,0);for(let n=3;n<=12;n+=3){arcLine(X(n-3),X(n),0xee5f2b,1.1);if(!(await hopTo(X,n)))return;pt("",X(n),0,{color:0xee5f2b})}}},
 {m:"normal",t:"Sua vez: toque nos <b>3 múltiplos de 4</b> que aparecem na reta (sem contar o zero).",set(){nline(0,12);B().place(-6,-2.5,0)},
  a:{k:"pick",n:3,check:async p=>{const ns=p.map(([x,y])=>y==0?x+6:-1).sort((a,b)=>a-b);if(ns.join()=="4,8,12"){for(const n of ns)await bip.hop(n-6,0);return {ok:1,msg:"Isso! <b>4, 8 e 12</b>: pulando de 4 em 4."}}
   return {ok:0,msg:"Algum não está certo. Comece no zero e pule de 4 em 4."}}}},
 {m:"pensa",t:"<b>Divisor</b> é o outro lado da moeda: 3 é divisor de 12 porque 12 ÷ 3 dá exato, <b>sem sobrar nada</b>.",set(){B().place(-5,-3,30);for(let r=0;r<3;r++)for(let c=0;c<4;c++)cube(-1.5+c*.9,1.4-r*.9,NCOL.u,{s:.6});label("12 = 3 × 4",0,-1.6,.3,{size:.55})}},
 {m:"aponta",t:"Os divisores de 12 aparecem nos retângulos que dá para montar com 12 cubos: 1 × 12, 2 × 6 e 3 × 4. Então os divisores de 12 são <b>1, 2, 3, 4, 6 e 12</b>.",set(){B().place(-6,-3.5,30)},
  async play(){const C=[];for(let i=0;i<12;i++)C.push(cube(-5.5+i*.9,2.5,NCOL.u,{s:.5}));label("1 × 12",0,3.5,.3,{size:.45});if(!(await wait(900)))return;
   for(const [r,c,yy] of [[2,6,.5],[3,4,-2]]){const cs=C.map(m=>{const n=cube(0,0,NCOL.d,{s:.5});n.position.copy(m.position);return n});
    if(!(await Promise.all(cs.map((m,i)=>slide(m,-(c-1)*.35+(i%c)*.7,yy+((r-1)/2-Math.floor(i/c))*.7,500,.5)))))return;label(`${r} × ${c}`,(c)*.35+.8,yy,.3,{size:.45});if(!(await wait(500)))return}}},
 {m:"normal",t:"Teste rápido.",set(){B().place(0,-3,90)},a:{k:"opt",q:"Qual destes NÃO é divisor de 18?",o:["2","3","4","6"],ans:2,ok:"Certo! 18 ÷ 4 = 4 e <b>sobra 2</b>. Então 4 não é divisor de 18.",no:"Faça a divisão: ela tem que dar exata."}},
 {m:"normal",t:"Mais um.",set(){B().place(0,-3,90)},a:{k:"opt",q:"Qual número é múltiplo de 2 e também de 5?",o:["15","20","25"],ans:1,ok:"Isso: <b>20</b> = 2 × 10 = 5 × 4. Todo número terminado em 0 é múltiplo de 2 e de 5.",no:"Precisa ser par e terminar em 0 ou 5."}},
 {m:"festa",end:1,t:"Múltiplos e divisores dominados!",set(){B().place(0,0,-90)},badge:["3·4","Caçador de múltiplos","Múltiplos e divisores."]}]},

/* 8 */{t:"Números primos",d:"Os números que só formam um retângulo, e o crivo de Eratóstenes.",i:"7",steps:[
 {m:"pensa",t:"Com 7 cubos só dá para montar uma fila: 1 × 7. Se tento 2 fileiras, sobra um. Números assim são os <b>primos</b>: só têm dois divisores, o 1 e eles mesmos.",set(){B().place(-5,-3,30)},
  async play(){const C=[];for(let i=0;i<7;i++)C.push(cube(-3+i,2,NCOL.u,{s:.6}));label("1 × 7",0,3,.3,{size:.45});if(!(await wait(900)))return;
   for(let i=0;i<7;i++){const m=cube(-3+i,2,i==6?NCOL.red:NCOL.d,{s:.6});if(!(await slide(m,i<6?-1+(i%3)*.9:2.2,i<6?-.2-Math.floor(i/3)*.9:-.6,220,.4)))return}label("sobra 1!",2.2,-1.5,.4,{size:.45,color:"#d23f45"})}},
 {m:"aponta",t:"O grego <b>Eratóstenes</b> inventou uma peneira para achar primos: risco o 1, depois os múltiplos de 2, de 3 e de 5. O que não for riscado é <b>primo</b>.",set(){B().place(-6,-2.5,30);camTo({th:Math.PI/2-.25,ph:.9,r:13,tx:0,tz:-.8})},
  async play(){const T=crivo();if(!(await wait(500)))return;T[1].userData.paint("#c3cedc","#7d8a9a");
   for(const p of [2,3,5]){if(!(await wait(500)))return;T[p].userData.paint("#1b9a52","#fff",0x146b3a);for(let n=2*p;n<=30;n+=p){if(!(await wait(70)))return;T[n].userData.paint("#c3cedc","#7d8a9a")}}
   for(let n=2;n<=30;n++)if(isPrime(n))T[n].userData.paint("#1b9a52","#fff",0x146b3a)}},
 {m:"aponta",t:"Sobraram os primos até 30: <b>2, 3, 5, 7, 11, 13, 17, 19, 23 e 29</b>.",set(){B().place(-6,-2.5,30);camTo({tz:-.8});crivo(n=>isPrime(n)?"p":"x")}},
 {m:"normal",t:"Toque em <b>2 números primos</b> no quadro.",set(){B().place(-6,-2.5,30);camTo({tz:-.8});crivo()},
  a:{k:"pick",n:2,mark:0,check:async p=>{const ns=p.map(([x,y])=>(y>=0&&y<=2&&x>=-5&&x<=4)?(2-y)*10+x+6:0);if(ns.every(isPrime))return {ok:1,msg:`Isso! <b>${ns.join(" e ")}</b> são primos.`};
   const bad=ns.find(n=>!isPrime(n));return {ok:0,msg:bad>1?`O ${bad} não é primo: ele tem outros divisores. Tente de novo.`:"Toque nos números do quadro. Lembre: o 1 não é primo."}}}},
 {m:"normal",t:"Pergunta clássica.",set(){B().place(0,-3,90)},a:{k:"opt",q:"O número 1 é primo?",o:["Sim","Não"],ans:1,ok:"Certo! O 1 tem <b>só um</b> divisor. Primos têm exatamente dois.",no:"Quantos divisores o 1 tem?"}},
 {m:"normal",t:"Mais uma.",set(){B().place(0,-3,90)},a:{k:"opt",q:"Qual é o único número primo que é par?",o:["2","4","0"],ans:0,ok:"Isso: o <b>2</b>. Todos os outros pares são divisíveis por 2.",no:"Os pares são múltiplos de 2..."}},
 {m:"festa",end:1,t:"Você peneirou os primos como Eratóstenes!",set(){B().place(0,0,-90)},badge:["7","Peneira de primos","Números primos."]}]},

/* 9 */{t:"MMC e MDC",d:"Onde os pulos se encontram e o maior pedaço que serve nos dois.",i:"∩",steps:[
 {m:"pensa",t:"Imagine dois sapos saindo do zero: um pula de 4 em 4 (caminho <b>laranja</b>) e o outro de 6 em 6 (caminho <b>verde</b>). Onde eles se encontram primeiro?",set(){camTo({th:Math.PI/2-.2,ph:.9,r:13,tx:0,tz:0});B().place(-6,-3,30)},
  async play(){const X=nline(0,24,{k:.5,every:2});for(let n=4;n<=24;n+=4){arcLine(X(n-4),X(n),0xee5f2b,1);if(!(await wait(220)))return}
   for(let n=6;n<=24;n+=6){const a=arcLine(X(n-6),X(n),0x1b9a52,1.8);if(!(await wait(220)))return}[12,24].forEach(n=>pt("",X(n),0,{color:0xd58200,pulse:1}))}},

let cw=0,cl=0,step=0,solved=false,busy=false;

function say(t,cls="",m){const s=$("say");s.className=cls;$("txt").innerHTML=t;s.querySelector(".who").textContent=cls=="ok"?"BIP · ACERTOU!":cls=="no"?"BIP · QUASE!":"BIP";if(m){$("face").innerHTML=FACE2D(m);bip&&bip.face(m)}}
function setMood(m){$("face").innerHTML=FACE2D(m);bip.face(m)}
async function show(){const L=LES(),S=L.steps[step],n=L.steps.length,id=++runId;
 $("lnum").textContent="AULA "+String(cl+1).padStart(2,"0");$("ltit").textContent=`Mundo ${cw+1} · ${L.t}`;
 const pc=Math.round(step/(n-1)*100);$("lbar").style.width=pc+"%";$("lpc").textContent=pc+"%";
 $("back").style.visibility=step?"visible":"hidden";$("next").textContent=S.end?"Concluir aula ✓":"Prosseguir →";
 onPick=null;ov("");actP("");clearStage();bip.walking=0;bip.fix=S.fix||(S.a&&/turn|prog/.test(S.a.k))?1:0;
 solved=!S.a;say(S.t,"",S.m);
 if(S.set)S.set();
 if(S.badge)ov(`<div class="badge"><div class="medal">${S.badge[0]}</div><h2>${S.badge[1]}</h2><div>${S.badge[2]}</div><div class="xp">+${XP_LESSON} ${BIPV.COIN} Bipcoins</div></div>`);
 if(S.a)setup(S.a,S);
 $("next").disabled=!solved||!!S.play;
 if(S.play){await S.play();if(id==runId&&!S.a)$("next").disabled=false}}
function win(msg){solved=true;$("next").disabled=false;say(msg,"ok","festa");if(bip)confetti(bip.x,bip.y);const id=runId;setTimeout(()=>{if(id==runId&&solved)setMood("feliz")},1800)}
function miss(msg){say(msg,"no","ops")}

function setup(a,S){
 if(a.k=="opt"){actP(`<div class="panel"><div class="q">${a.q}</div><div class="opts">${a.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div></div>`);
  $("act").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(solved)return;const i=+b.dataset.i;
   if(i==a.ans){b.classList.add("right");$("act").querySelectorAll(".opt").forEach(x=>x.disabled=true);win(a.ok)}else{b.classList.add("wrong");b.disabled=true;miss(a.no)}})}
 if(a.k=="pick"){let pts=[];actP(`<div class="panel tools"><span>Toque no chão · <b id="pc">0</b> de ${a.n}</span><button class="btn sm" id="pclr">Limpar</button></div>`);
  const reset=()=>{const id=runId;clearStage();S.set&&S.set();pts=[];$("pc").textContent=0;say(S.t,"",S.m)};
  $("pclr").onclick=()=>{if(busy||solved)return;runId++;show()};
  onPick=async p=>{if(busy||solved)return;if(pts.some(q=>q[0]==p[0]&&q[1]==p[1]))return miss("Esse ponto já foi marcado. Escolha outro lugar.");
   pts.push(p);if(a.mark!==0)pt(a.names?a.names[pts.length-1]:"",p[0],p[1]);$("pc").textContent=pts.length;
   if(pts.length==a.n){busy=true;const r=await a.check(pts);busy=false;if(!r)return;if(r.ok)win(r.msg);else{miss(r.msg);if(a.n>1){const id=runId;await wait(1400);if(id==runId&&!solved){const t=$("txt").innerHTML;runId++;await show();say(t,"no","ops")}}else pts=[]}}}}
 if(a.k=="turn"){let h=bip.a;const base=bip.a;const draw=()=>{const d=((h-base)%360+360)%360;$("tv").textContent=d+"°";clearStage();S.set();bip.place(bip.x,bip.y,h);if(d)arc([0,0],base,base+d,1.4,{txt:d+"°"})};
  actP(`<div class="panel tools"><button class="blk t" id="tl">↺ Girar ${a.step}° (esquerda)</button><span class="readout" id="tv">0°</span><button class="blk t" id="tr">↻ Girar ${a.step}° (direita)</button></div>`);
  const go=async d=>{if(busy||solved)return;busy=true;await bip.turn(d);h+=d;busy=false;draw();const g=((h-base)%360+360)%360;
   if(g==a.target)win(`Isso! Girei <b>${a.target}°</b> para a esquerda (sentido anti-horário) e agora olho para a bandeira.`);else say(`Girei ${g}° no total. Continue até olhar para a bandeira.`,"",S.m)};
  $("tl").onclick=()=>go(a.step);$("tr").onclick=()=>go(-a.step)}
 if(a.k=="slider"){actP(`<div class="panel"><div class="readout"><span id="sv">0°</span> · <span id="st">nulo</span></div><input type="range" min="0" max="180" step="5" value="30" id="sl" aria-label="Abertura do ângulo"></div>`);
  const typ=a=>a==0?"nulo":a<90?"agudo":a==90?"reto":a<180?"obtuso":"raso";
  const upd=()=>{const v=+$("sl").value;clearStage();S.set();pt("",0,0);semi([0,0],[1,0]);semi([0,0],[Math.cos(v*D2R),Math.sin(v*D2R)]);if(v==90)rightMark([0,0],0,.6);else if(v)arc([0,0],0,v,1.5,{txt:v+"°"});
   $("sv").textContent=v+"°";$("st").textContent=typ(v);if(!solved&&a.test(v))win(a.ok)};$("sl").oninput=upd;upd()}
 if(a.k=="step"){const v=(a.init||a.c.map(c=>c[1])).slice();
  actP(`<div class="panel"><div class="readout" id="stv"></div><div class="tools">${a.c.map((c,i)=>`<span class="stp"><b>${c[0]}</b><button class="btn sm" data-d="${i}" data-s="-1" aria-label="Menos: ${c[0]}">−</button><span class="readout sn" id="sv${i}">${v[i]}</span><button class="btn sm" data-d="${i}" data-s="1" aria-label="Mais: ${c[0]}">+</button></span>`).join("")}</div></div>`);
  const upd=()=>{clearStage();S.set&&S.set();a.draw(v);a.c.forEach((c,i)=>$("sv"+i).textContent=v[i]);$("stv").textContent=a.txt(v);if(!solved&&a.test(v))win(a.ok(v))};
  $("act").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(solved)return;const i=+b.dataset.d,c=a.c[i];v[i]=Math.max(c[1],Math.min(c[2],v[i]+ +b.dataset.s));upd()});upd()}
 if(a.k=="prog"){let list=[],rep=1;const BL=a.blocks,cls={f:"f",t:"t"};
  actP(`<div class="panel"><div class="prog" id="pl"></div><div class="tools">${BL.map((b,i)=>`<button class="blk ${b[1]}" data-b="${i}">${b[0]}</button>`).join("")}<button class="blk rep" id="prep">Repetir tudo: 1×</button><button class="btn sm" id="pclr">Limpar</button><button class="btn main" id="prun" style="font-size:1rem;padding:6px 16px">▶ Executar</button></div></div>`);
  const draw=()=>{$("pl").innerHTML=list.length?(rep>1?`<span style="background:var(--loop)">Repetir ${rep}× [</span>`:"")+list.map(i=>`<span style="background:var(--${BL[i][1]=="f"?"go":"turn"})">${BL[i][0]}</span>`).join("")+(rep>1?`<span style="background:var(--loop)">]</span>`:""):'<span class="ph">Toque nos blocos para montar o programa</span>';$("prep").textContent=`Repetir tudo: ${rep}×`};draw();
  const st={x:bip.x,y:bip.y,a:bip.a};
  $("act").querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{if(busy||solved||list.length>=10)return;list.push(+b.dataset.b);draw()});
  $("prep").onclick=()=>{if(busy||solved)return;rep=rep%6+1;draw()};
  $("pclr").onclick=()=>{if(busy||solved)return;list=[];rep=1;draw();clearStage();S.set&&S.set();bip.place(st.x,st.y,st.a);say(S.t,"",S.m)};
  $("prun").onclick=async()=>{if(busy||solved||!list.length)return;busy=true;clearStage();S.set&&S.set();bip.place(st.x,st.y,st.a);say("Executando…","",S.m);
   const verts=[[st.x,st.y]],turns=[];let pend=0;
   for(let r=0;r<rep;r++)for(const i of list){const [,k,v]=BL[i];
    if(k=="f"){if(pend){turns.push(pend);pend=0}const nx=bip.x+Math.cos(bip.a*D2R)*v,ny=bip.y+Math.sin(bip.a*D2R)*v;if(!(await bip.walk([[nx,ny]],{trail:COL.poly,noTurn:1,ms:300}))){busy=false;return}verts.push([bip.x,bip.y])}
    else{if(!(await bip.turn(v))){busy=false;return}pend+=v}}
   if(pend)turns.push(pend);busy=false;
   const last=verts[verts.length-1],closed=verts.length>2&&Math.hypot(last[0]-verts[0][0],last[1]-verts[0][1])<.01;
   const uniq=[];verts.slice(0,-1).forEach(v=>{if(!uniq.some(u=>Math.hypot(u[0]-v[0],u[1]-v[1])<.01))uniq.push(v)});
   const res={closed,n:closed?verts.length-1:uniq.length};const tr=closed?turns.slice(0,res.n).map(t=>((t%360)+360)%360):turns;
   if(closed&&res.n==uniq.length&&a.check(res,tr)){poly(uniq,{edges:false});win(a.ok)}else miss(a.no)}}}

$("next").onclick=()=>{const L=LES();if(!solved||$("next").disabled)return;
 if(L.steps[step].end){const k=lid(cw,cl),before=new Set(save.done);if(!save.done.includes(k))save.done.push(k);store();
  const now=new Set(save.done),nx=cw+1;if(WORLDS[nx]&&!worldOpen(nx,before)&&worldOpen(nx,now))unlockMsg=WORLDS[nx].L?`Mundo ${nx+1} liberado: ${WORLDS[nx].t}!`:`Você terminou o Mundo ${cw+1}! O Mundo ${nx+1} (${WORLDS[nx].t}) está chegando.`;
  return closeLesson()}
 step++;show()};
$("back").onclick=()=>{if(busy||!step)return;step--;show()};
$("exit").onclick=closeLesson;
document.addEventListener("keydown",e=>{if($("lesson").classList.contains("hidden")||e.target.tagName=="INPUT")return;if(e.key=="ArrowRight"&&!$("next").disabled)$("next").click();if(e.key=="ArrowLeft")$("back").click();if(e.key=="Escape")closeLesson()});
drawHome();
</script>
